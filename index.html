Usa las vías de tranvía (la calle con raíles, en la pestaña Calles).":"In New Orleans fährt die Straßenbahn auf der Straße. Nimm die Straßenbahngleise (die Straße mit Schienen, bei Straßen).","¡Qué profundo! La 🏁 está en la otra orilla, en el piso 2. Sube dos pisos y cruza el cañón por un puente altísimo.":"So tief! Die 🏁 ist auf der anderen Seite, im 2. Stock. Steig zwei Stockwerke hoch und fahr über eine ganz hohe Brücke über den Canyon.","Cruza la bahía por un puente muy largo y entra en la ciudad por una calle de tranvía.":"Fahr über eine sehr lange Brücke über die Bucht und dann auf einer Straßenbahnstraße in die Stadt.","El tren «L» de Chicago va elevado por encima de las calles. Rodea la manzana por arriba hasta la 🏁 del piso 1.":"Die „L“-Bahn in Chicago fährt hoch über den Straßen. Fahr oben um den Häuserblock bis zur 🏁 im 1. Stock.","Arriba la ciudad está llena de rascacielos. ¡Ve por debajo con el metro! Baja con una rampa al piso menos uno y sube al otro lado.":"Oben ist die Stadt voller Wolkenkratzer. Fahr mit der U-Bahn darunter durch! Fahr mit einer Rampe in den Stock minus eins und auf der anderen Seite wieder hoch.","Junto a las cataratas, el río baja con mucha fuerza. Crúzalo por un puente.":"Neben den Wasserfällen rauscht der Fluss. Fahr über eine Brücke hinüber.","¡Dos trenes! El de pasajeros va de lado a lado y el de mercancías hacia arriba. Que uno pase por encima del otro para que no choquen.":"Zwei Züge! Der Personenzug fährt quer und der Güterzug nach oben. Lass einen über den anderen fahren, damit sie nicht zusammenstoßen.","🌏 Asia":"🌏 Asien","Bombay":"Mumbai","Bahía de Ha Long":"Halong-Bucht","Shanghái":"Shanghai","La Gran Muralla":"Die Chinesische Mauer","Seúl":"Seoul","Monte Fuji":"Fuji","INDIA":"INDIEN","MONGOLIA":"MONGOLEI","JAPÓN":"JAPAN","COREA":"KOREA","TAILANDIA":"THAILAND","PAKISTÁN":"PAKISTAN","MALASIA":"MALAYSIA","INDONESIA":"INDONESIEN","FILIPINAS":"PHILIPPINEN","OCÉANO ÍNDICO":"INDISCHER OZEAN","MAR DE CHINA":"SÜDCHINESISCHES MEER","Asia: ¡a construir hacia arriba! Cruza el río por un puente: una rampa para subir, vía arriba y otra rampa para bajar.":"Asien: Wir bauen in die Höhe! Fahr über eine Brücke über den Fluss: eine Rampe hinauf, oben Gleise und eine Rampe hinunter.","Una laguna enorme. Sube a la vía elevada y gira por encima del agua hasta el otro lado.":"Eine riesige Lagune. Fahr auf die Hochbahn und bieg über dem Wasser ab, bis du auf der anderen Seite bist.","La estación 🏁 está en el piso 1, encima de las calles. Sube y gira por arriba: las curvas también van en alto.":"Der Bahnhof 🏁 ist im 1. Stock, über den Straßen. Fahr hoch und bieg oben ab: Kurven gehen auch in der Höhe.","¡La 🏁 está en el piso 3, en lo alto de la montaña! Haz una espiral con curvas rampa (➕ seguir te ayuda) y luego sigue recto.":"Die 🏁 ist im 3. Stock, hoch oben auf dem Berg! Bau eine Spirale aus Rampenkurven (➕ weiter hilft dir) und fahr dann geradeaus.","El mercado flotante tiene dos canales. Haz dos puentes y recoge las dos 🪙 por arriba.":"Der schwimmende Markt hat zwei Kanäle. Bau zwei Brücken und sammle oben beide 🪙 ein.","Una bahía llena de islas. Ve por encima del mar, de isla en isla, hasta el otro lado.":"Eine Bucht voller Inseln. Fahr über dem Meer von Insel zu Insel bis auf die andere Seite.","El tren elevado de Shanghái va por el piso 2, por encima de la ciudad. Sube dos pisos y cruza la ciudad por arriba.":"Die Hochbahn von Shanghai fährt im 2. Stock, über der Stadt. Steig zwei Stockwerke hoch und fahr oben über die Stadt.","La 🏁 está arriba de la muralla, en el piso 2. Esta vez la espiral gira hacia la derecha.":"Die 🏁 ist oben auf der Mauer, im 2. Stock. Diesmal dreht sich die Spirale nach rechts.","Pasa por el túnel de la montaña y después cruza el río Han por un puente.":"Fahr durch den Tunnel im Berg und dann über eine Brücke über den Fluss Han.","¡El gran final! Sube con el tren bala por una espiral entera hasta el piso 4 y luego baja a la estación sobre el lago.":"Das große Finale! Fahr mit dem Hochgeschwindigkeitszug eine ganze Spirale hoch bis in den 4. Stock und dann zum Bahnhof über dem See.","Roma":"Rom","Berlín":"Berlin","En Roma la plaza de la fuente está llena de gente. Rodéala por arriba y recoge la 🪙 por el camino.":"In Rom ist der Platz mit dem Brunnen voller Menschen. Fahr oben herum und sammle unterwegs die 🪙 ein.","Pasa por el arco del medio de la gran puerta y cruza el río por un puente: sube con una rampa y baja con otra.":"Fahr durch den mittleren Bogen des großen Tors und über eine Brücke über den Fluss: mit einer Rampe hinauf und mit einer anderen hinunter.","Decorar":"Gestalten","Estación":"Bahnhof","Desvío":"Weiche","Curva rampa":"Rampenkurve","El tiempo":"Wetter","La vía se divide en dos: recto o curva. Se coloca solo hacia el lado que encaja; tócalo con esta misma pieza para girarlo o darle la vuelta. Con ✋ cambias el camino del tren.":"Die Strecke teilt sich in zwei: geradeaus oder in die Kurve. Sie legt sich von selbst so hin, wie sie passt; tippe sie mit demselben Teil an, um sie zu drehen oder umzudrehen. Mit ✋ änderst du den Weg des Zuges.","Gira y cambia un piso: se coloca sola hacia el lado que encaja. Pon 4 seguidas (con ➕ seguir) y harás una espiral, como una montaña rusa. El botón ⇅ la cambia de subir a bajar.":"Biegt ab und wechselt das Stockwerk: Sie legt sich von selbst so hin, wie sie passt. Leg 4 hintereinander (mit ➕ weiter), dann wird es eine Spirale wie bei einer Achterbahn. Mit dem Knopf ⇅ wechselst du zwischen hinauf und hinunter.","Cambia un piso. Tócala junto a una vía suelta y se pone a su altura (el número rojo es el piso de esa punta): desde el suelo sube, y desde arriba baja. Si ya está puesta, sus botones: ➕ seguir (pone otra igual, ya unida), 🔄 girar y ⇅ sube/baja.":"Wechselt das Stockwerk. Tippe sie neben einem offenen Ende an, dann stellt sie sich auf dessen Höhe (die rote Zahl ist das Stockwerk dieses Endes): Vom Boden aus geht sie hinauf, von oben hinunter. Wenn sie liegt, hat sie Knöpfe: ➕ weiter (setzt noch eine an, schon verbunden), 🔄 drehen und ⇅ hinauf/hinunter.","Elige la rampa.":"Nimm die Rampe.","Para bajar: vuelve a ⛰️ Rampas y pon la rampa en el recuadro. Desde arriba, la rampa baja sola.":"Zum Hinunterfahren: Geh zurück zu ⛰️ Rampen und leg die Rampe in das Kästchen. Von oben geht die Rampe von selbst hinunter.","¡Ahora una espiral! En ⛰️ Rampas elige la curva rampa.":"Jetzt eine Spirale! Nimm bei ⛰️ Rampen die Rampenkurve.","Botón ⚡ Sorpresas al jugar (fuego, lluvia, vacas…)":"Knopf ⚡ Überraschungen beim Spielen (Feuer, Regen, Kühe…)","Desafío de trenes":"Zug-Wettkampf","Dos trenes frente a frente: ¡empuja al otro fuera del muelle!":"Zwei Züge Nase an Nase: Schieb den anderen vom Steg!","Aprender a jugar":"Spielen lernen","Viaja por el mundo: lleva el tren de la estación A hasta la 🏁 construyendo la vía.":"Reise um die Welt: Bau die Strecke, um den Zug vom Bahnhof A zur 🏁 zu bringen.","Construye lo que quieras, con todas las piezas, trenes, coches y monumentos.":"Bau, was du willst, mit allen Teilen, Zügen, Autos und Denkmälern.","Un tutorial paso a paso, con voz, para antes de la aventura o del juego libre.":"Eine Anleitung Schritt für Schritt, vorgelesen, vor dem Abenteuer oder dem freien Spiel.","Página para padres":"Seite für Eltern","Arrancar / parar":"Start / Stopp","Volver a poner los trenes en su sitio":"Die Züge zurück an ihren Start stellen","Deshacer":"Rückgängig","Arreglar: busca dónde se caería el tren":"Reparieren: finden, wo der Zug herunterfallen würde","Velocidad":"Geschwindigkeit","Inicio":"Startseite","Tutorial paso a paso":"Anleitung Schritt für Schritt","Ayuda: cómo se juega":"Hilfe: so wird gespielt","Proyectos, guardar y cargar":"Projekte, speichern und laden","Sonido":"Ton","Pantalla completa":"Vollbild","Vaciar el tablero":"Das Spielfeld leeren","Acercar":"Vergrößern","Alejar":"Verkleinern","Ver todo el circuito":"Die ganze Strecke zeigen","Mapa pequeño":"Minikarte","Ver la vía de lado":"Die Strecke von der Seite ansehen","Piso donde construyes":"Stockwerk, auf dem du baust","Subir un piso":"Ein Stockwerk hoch","Bajar un piso":"Ein Stockwerk runter","Seguir al tren":"Dem Zug folgen","Ir montado en el tren":"Im Zug mitfahren","PISO":"STOCK","METRO":"U-BAHN","Cerrar":"Schließen","Empezar":"Start","Cargar":"Laden","Escuchar":"Anhören","Sí":"Ja","Vías":"Gleise","Desvíos":"Weichen","Rampas":"Rampen","Especiales":"Besonderes","Campo":"Land","Calles":"Straßen","Suelos":"Boden","Ciudad":"Stadt","Monumentos":"Denkmäler","Trenes":"Züge","Mano":"Hand","Borrar":"Radiergummi","Arrastra para mover el tablero. Toca una pieza para girarla, un desvío para cambiar su camino (flecha verde) y un tren para darle la vuelta.":"Zieh, um das Spielfeld zu verschieben. Tippe ein Teil an, um es zu drehen, eine Weiche, um ihren Weg zu ändern (grüner Pfeil), und einen Zug, um ihn umzudrehen.","Toca una pieza o un tren para quitarlo. (Para cambiar una pieza no hace falta borrar: elige la nueva y tócala encima.)":"Tippe ein Teil oder einen Zug an, um es zu entfernen. (Um ein Teil zu wechseln, musst du nicht radieren: Nimm das neue und tippe darauf.)","Lápiz de vías":"Gleisstift","Cascada":"Wasserfall","El agua cae desde las rocas y hace espuma abajo. Pon agua 🌊 delante para que siga un río, y una vía elevada para pasar por encima.":"Das Wasser stürzt über die Felsen und schäumt unten. Leg Wasser 🌊 davor, damit ein Fluss weiterfließt, und eine Hochbahn, um darüberzufahren.","¡Ya sabes lo básico! En ⚙️ tienes la ayuda y tus circuitos, y en 🏠 la biblioteca con ciudades listas para jugar. Cuando seas mayor, aprende a subir y bajar con el tutorial ⛰️.":"Jetzt kannst du das Wichtigste! Bei ⚙️ findest du die Hilfe und deine Strecken, und bei 🏠 die Bibliothek mit Städten zum Spielen. Wenn du größer bist, lern mit der Anleitung ⛰️, hinauf und hinunter zu bauen.","Más":"Mehr","Ayuda":"Hilfe","Mis circuitos":"Meine Strecken","Modo constructor":"Baumeister-Modus","Herramientas avanzadas siempre a la vista (🔧 arreglar, 📐 vista de lado, pisos, mapa)":"Fortgeschrittene Werkzeuge immer sichtbar (🔧 reparieren, 📐 Seitenansicht, Stockwerke, Karte)","Apagado, la pantalla es más sencilla: los pisos y la vista de lado salen solos cuando se usan rampas, y 🔧 aparece cuando un tren se puede caer.":"Wenn es aus ist, ist der Bildschirm einfacher: Stockwerke und Seitenansicht erscheinen von selbst, wenn Rampen benutzt werden, und 🔧 erscheint, wenn ein Zug herunterfallen könnte.","Tienda":"Laden","Trenes especiales":"Besondere Züge","Mejoras":"Verbesserungen","Estaciones":"Bahnhöfe","Tren de oro":"Goldener Zug","¡Todo de oro! Brilla y va dejando estrellitas.":"Ganz aus Gold! Er glänzt und hinterlässt kleine Sterne.","Tren arcoíris":"Regenbogenzug","Cada vagón de un color, y deja una estela de colores.":"Jeder Wagen hat eine andere Farbe, und er hinterlässt eine Regenbogenspur.","Tren dragón":"Drachenzug","Una locomotora con cara de dragón que ruge y echa fuego por la boca.":"Eine Lok mit Drachengesicht, die brüllt und Feuer speit.","Tren de bomberos":"Feuerwehrzug","Lleva un vagón de agua y apaga los fuegos que hay junto a la vía al pasar.":"Er hat einen Wasserwagen und löscht beim Vorbeifahren Feuer neben den Gleisen.","Pintura":"Farbe","Elige el color de tus trenes en la pestaña 🚂 Trenes.":"Wähl die Farbe deiner Züge im Reiter 🚂 Züge.","Trenes largos":"Lange Züge","Hasta 9 vagones en cada tren (antes 6).":"Bis zu 9 Wagen an jedem Zug (statt 6).","Súper bocina":"Super-Hupe","El botón 📣 del conductor toca una fanfarria.":"Der Knopf 📣 des Lokführers spielt eine Fanfare.","Turbo rápido":"Schneller Turbo","El turbo 🚀 se recarga el doble de rápido.":"Der Turbo 🚀 lädt sich doppelt so schnell auf.","Estaciones grandes":"Große Bahnhöfe","Caben el doble de pasajeros y de cajas esperando en cada estación.":"An jedem Bahnhof können doppelt so viele Fahrgäste und Kisten warten.","Ponlo junto a una estación (pestaña 🏙️ Ciudad): llega más gente a esa estación.":"Stell es neben einen Bahnhof (Reiter 🏙️ Stadt): Dann kommen mehr Leute zu diesem Bahnhof.","Monedas y tienda":"Münzen und Laden","Regalar 50 monedas":"50 Münzen schenken","Vaciar monedas y tienda":"Münzen und Laden zurücksetzen","¿Vaciar las monedas y la tienda?":"Münzen und Laden zurücksetzen?","Las monedas vuelven a 0 y lo comprado se vuelve a cerrar.":"Die Münzen gehen auf 0 zurück und alles Gekaufte wird wieder gesperrt.","Regalar monedas":"Münzen schenken","Noche":"Nacht","Toca para que se haga de noche (y otra vez para que sea de día). Los trenes y los coches encienden los faros y las casas las luces.":"Tippe, damit es Nacht wird (und noch mal, damit es Tag wird). Züge und Autos schalten ihre Scheinwerfer ein und die Häuser ihr Licht.","Pitar":"Tuten","Parar / arrancar":"Halt / weiter","Saltar":"Springen","Marcha atrás":"Rückwärts","Palanca de velocidad":"Geschwindigkeitshebel","Dejar de conducir":"Nicht mehr fahren","Sorpresas":"Überraschungen","Sorpresas y desastres":"Überraschungen und Unglücke","Pestaña ⚡ Sorpresas (fuego, lluvia, vacas, señales…)":"Reiter ⚡ Überraschungen (Feuer, Regen, Kühe, Signale…)","Sorpresas al azar mientras juegan (vacas y rocas en la vía)":"Zufällige Überraschungen beim Spielen (Kühe und Felsen auf den Gleisen)","Nadie se hace daño: los choques son de dibujos animados y siempre hay un rescate (bomberos, grúa…). Si a tu peque le asustan, apágalas aquí.":"Niemand wird verletzt: Unfälle sind wie im Zeichentrickfilm und es gibt immer eine Rettung (Feuerwehr, Kran…). Wenn sie Ihrem Kind Angst machen, schalten Sie sie hier aus.","Señal":"Signal","Ponla en una vía. Se pone roja y para al tren si otro tren está todavía en el tramo de delante (hasta la próxima señal). Así los trenes no chocan. Tócala con ✋ para ponerla roja tú.":"Stell es auf ein Gleis. Es wird rot und hält den Zug an, wenn noch ein anderer Zug im Abschnitt davor ist (bis zum nächsten Signal). So stoßen die Züge nicht zusammen. Tippe es mit ✋ an, um es selbst auf Rot zu stellen.","Desvío listo":"Schlaue Weiche","Toca un desvío para hacerlo listo. Después de cada tren cambia solo, y el siguiente va por el otro lado. Si un lado tiene un tren, manda el tren por el lado libre; si los dos están ocupados, el tren espera.":"Tippe eine Weiche an, um sie schlau zu machen. Nach jedem Zug stellt sie sich von selbst um, sodass der nächste in die andere Richtung fährt. Wenn auf einer Seite ein Zug steht, schickt sie den Zug auf die freie Seite; wenn beide besetzt sind, wartet der Zug.","Barrera a mano":"Schranke von Hand","Toca un paso a nivel: ahora tú bajas y subes la barrera con ✋. Si viene el tren y la barrera está subida… ¡bonk! La grúa se lleva el coche.":"Tippe einen Bahnübergang an: Jetzt senkst und hebst du die Schranke mit ✋. Wenn der Zug kommt und die Schranke oben ist… bums! Der Abschleppwagen holt das Auto ab.","Fuego":"Feuer","Toca una casa, un árbol o una estación y se prende fuego. Pulsa ▶️ y los bomberos 🚒 van por la calle a apagarlo. Sin calle, tócalo con ✋ para echar agua.":"Tippe ein Haus, einen Baum oder einen Bahnhof an, dann brennt es. Drück ▶️, dann fährt die Feuerwehr 🚒 über die Straße und löscht. Ohne Straße tippst du es mit ✋ an, um Wasser zu spritzen.","Vaca en la vía":"Kuh auf den Gleisen","Pon una vaca en la vía. El tren frena, pita y la vaca se aparta.":"Stell eine Kuh auf die Gleise. Der Zug bremst, tutet und die Kuh geht weg.","Rocas en la vía":"Felsen auf den Gleisen","Pon rocas en la vía. El tren se para delante: tócalas y la grúa las quita.":"Leg Felsen auf die Gleise. Der Zug hält davor an: Tippe sie an, dann holt der Kran sie weg.","Sol":"Sonne","Hace buen tiempo. El agua de las inundaciones se va.":"Schönes Wetter. Das Hochwasser verschwindet.","Lluvia":"Regen","Llueve y los trenes van más despacio. Si llueve mucho, el río se desborda y tapa las vías de al lado: súbelas con rampas o pon el sol.":"Es regnet und die Züge fahren langsamer. Wenn es viel regnet, überschwemmt der Fluss die Gleise daneben: Heb sie mit Rampen an oder hol die Sonne.","Nieve":"Schnee","Nieva: los trenes van despacio y la nieve tapa la vía. Toca la nieve para quitarla.":"Es schneit: Die Züge fahren langsam und der Schnee bedeckt die Gleise. Tippe den Schnee an, um ihn wegzuräumen.","Viento":"Wind","Mucho viento: los árboles junto a la vía pueden caerse encima. Toca el árbol y la grúa lo quita.":"Sehr windig: Bäume neben den Gleisen können daraufstürzen. Tippe den Baum an, dann holt der Kran ihn weg.","Lápiz de calles":"Straßenstift","Arrastra el dedo y la calle se dibuja sola, con curvas y cruces. Si cruzas una vía recta, pone un paso a nivel. Si empiezas junto a una calle, se une a ella.":"Zieh den Finger, dann zeichnet sich die Straße von selbst, mit Kurven und Kreuzungen. Wenn du ein gerades Gleis kreuzt, kommt ein Bahnübergang dazu. Wenn du neben einer Straße anfängst, wird sie verbunden.","Arrastra el dedo por el tablero y la vía se dibuja sola, con rectas y curvas. Si empiezas junto a una vía suelta, se une a ella; si cruzas tu camino, pone un cruce. Vuelve atrás con el dedo para deshacer.":"Zieh den Finger über das Spielfeld, dann zeichnet sich die Strecke von selbst, mit Geraden und Kurven. Fang neben einem offenen Ende an, dann wird sie verbunden; kreuzt du deinen eigenen Weg, kommt eine Kreuzung dazu. Geh mit dem Finger zurück, um es rückgängig zu machen.","Recta larga":"Lange Gerade","Vía recta de 2 casillas.":"Ein gerades Gleis, 2 Felder lang.","Recta corta":"Kurze Gerade","Vía recta de 1 casilla, para rellenar huecos.":"Ein gerades Gleis, 1 Feld lang, zum Lückenfüllen.","Curva":"Kurve","Gira un cuarto de vuelta. Cuatro curvas hacen un círculo pequeño.":"Macht eine Vierteldrehung. Vier Kurven ergeben einen kleinen Kreis.","Curva grande":"Große Kurve","Curva suave que ocupa 2×2 casillas. Ideal para trenes largos.":"Eine sanfte Kurve über 2×2 Felder. Super für lange Züge.","Desvío a la izquierda":"Weiche links","La vía se divide: recto o a la izquierda. Con ✋ se cambia el camino; la flecha verde indica por dónde irá el tren.":"Die Strecke teilt sich: geradeaus oder links. Mit ✋ änderst du den Weg; der grüne Pfeil zeigt, wohin der Zug fährt.","Desvío a la derecha":"Weiche rechts","La vía se divide: recto o a la derecha. Con ✋ se cambia el camino; la flecha verde indica por dónde irá el tren.":"Die Strecke teilt sich: geradeaus oder rechts. Mit ✋ änderst du den Weg; der grüne Pfeil zeigt, wohin der Zug fährt.","Desvío en Y":"Y-Weiche","La vía se divide en dos curvas, izquierda y derecha. Con ✋ se elige cuál.":"Die Strecke teilt sich in zwei Kurven, links und rechts. Mit ✋ wählst du, welche.","Cruce":"Kreuzung","Dos vías se cruzan en el mismo piso. ¡Si pasan dos trenes a la vez, chocan!":"Zwei Gleise kreuzen sich im selben Stockwerk. Wenn zwei Züge gleichzeitig durchfahren, stoßen sie zusammen!","Rampa":"Rampe","Cambia un piso. Tócala junto a una vía suelta y se pone a su altura (el número rojo es el piso de esa punta). Con ⬆️ Sube va hacia arriba y con ⬇️ Baja hacia abajo. Si ya está puesta, sus botones: ➕ seguir (pone otra igual, ya unida), ↰ forma (recta o curva), 🔄 girar y ⇅ sube/baja.":"Wechselt ein Stockwerk. Tippe sie neben einem offenen Ende an, dann stellt sie sich auf dessen Höhe (die rote Zahl ist das Stockwerk dieses Endes). Mit ⬆️ Hoch steigt sie, mit ⬇️ Runter geht sie hinunter. Wenn sie liegt, hat sie Knöpfe: ➕ weiter (setzt noch eine an, schon verbunden), ↰ Form (gerade oder Kurve), 🔄 drehen und ⇅ hinauf/hinunter.","Curva rampa (izquierda)":"Rampenkurve (links)","Gira a la izquierda y cambia un piso (⬆️ Sube o ⬇️ Baja). Pon 4 seguidas y harás una espiral, como una montaña rusa. El botón ⇅ le da la vuelta.":"Biegt nach links ab und wechselt ein Stockwerk (⬆️ Hoch oder ⬇️ Runter). Leg 4 hintereinander, dann wird es eine Spirale wie bei einer Achterbahn. Der Knopf ⇅ dreht sie um.","Curva rampa (derecha)":"Rampenkurve (rechts)","Gira a la derecha y cambia un piso (⬆️ Sube o ⬇️ Baja). 4 seguidas hacen una espiral. El botón ⇅ le da la vuelta.":"Biegt nach rechts ab und wechselt ein Stockwerk (⬆️ Hoch oder ⬇️ Runter). 4 hintereinander ergeben eine Spirale. Der Knopf ⇅ dreht sie um.","El tren se para un momento y suena la campana.":"Der Zug hält kurz an und die Glocke läutet.","Túnel":"Tunnel","El tren pasa por dentro de una montaña y desaparece un momento.":"Der Zug fährt in einen Berg hinein und verschwindet kurz.","Túnel largo":"Langer Tunnel","Túnel de 2 casillas.":"Ein Tunnel, 2 Felder lang.","Tope":"Prellbock","Final de vía: el tren se para y vuelve marcha atrás.":"Ende der Strecke: Der Zug hält an und fährt rückwärts zurück.","Paso a nivel":"Bahnübergang","Una calle cruza la vía. Las barreras bajan cuando llega un tren y los coches esperan. Únelo a las calles de la pestaña 🚗.":"Eine Straße kreuzt die Gleise. Die Schranken gehen runter, wenn ein Zug kommt, und die Autos warten. Verbinde ihn mit den Straßen aus dem Reiter 🚗.","Calle recta":"Gerade Straße","Calle para coches. Dibuja calles y únelas a un paso a nivel para que los coches crucen la vía.":"Eine Straße für Autos. Zeichne Straßen und verbinde sie mit einem Bahnübergang, damit Autos über die Gleise fahren können.","Calle en curva":"Kurvige Straße","La calle gira un cuarto de vuelta.":"Die Straße macht eine Vierteldrehung.","Cruce en T":"T-Kreuzung","Tres calles se juntan. Los coches eligen solos hacia dónde ir.":"Drei Straßen treffen sich. Die Autos entscheiden selbst, wohin sie fahren.","Cruce de calles":"Kreuzung","Cuatro calles se juntan, con pasos de cebra. Los coches eligen camino al azar.":"Vier Straßen treffen sich, mit Zebrastreifen. Die Autos wählen zufällig einen Weg.","Calle con vías de tranvía":"Straße mit Straßenbahngleisen","Una calle por la que van a la vez los coches y el tranvía. El tranvía espera si un coche va delante. Ponla encima de una calle para cambiarla.":"Eine Straße für Autos und Straßenbahn. Die Straßenbahn wartet, wenn ein Auto davor ist. Leg sie auf eine Straße, um sie zu wechseln.","Curva de calle con vías":"Kurvige Straße mit Gleisen","La calle con vías de tranvía gira un cuarto de vuelta.":"Die Straße mit Straßenbahngleisen macht eine Vierteldrehung.","Elige un tren y toca una vía para ponerlo. Toca el tren para cambiar su dirección. Con ➖ ➕ eliges cuántos vagones lleva.":"Wähl einen Zug und tippe ein Gleis an, um ihn draufzustellen. Tippe den Zug an, um seine Richtung zu ändern. Mit ➖ ➕ wählst du, wie viele Wagen er zieht.","Toca una vía para ponerlo y tócalo para darle la vuelta. ➖ ➕ cambian los vagones.":"Tippe ein Gleis an, um ihn draufzustellen, und tippe ihn an, um ihn umzudrehen. ➖ ➕ ändern die Wagen.","Toca una calle para ponerlo. Anda cuando pulsas ▶️, elige camino en los cruces y espera en el paso a nivel. Tócalo para darle la vuelta.":"Tippe eine Straße an, um es draufzustellen. Es fährt, wenn du ▶️ drückst, wählt an Kreuzungen seinen Weg und wartet an Bahnübergängen. Tippe es an, um es umzudrehen.","Figura de adorno. Aquí no hay vía: si un tren llega, ¡descarrila!":"Eine Dekoration. Hier gibt es keine Gleise: Wenn ein Zug hierherkommt, entgleist er!","Un río, un lago o el mar. Pasa por encima con una vía elevada (sube con una rampa).":"Ein Fluss, ein See oder das Meer. Fahr mit einer Hochbahn darüber (fahr mit einer Rampe hoch).","Agua (río o mar)":"Wasser (Fluss oder Meer)","Arco del Triunfo (París)":"Triumphbogen (Paris)","Ocupa 3 casillas. Una vía (o una calle) puede pasar por debajo del arco central.":"Braucht 3 Felder. Ein Gleis (oder eine Straße) kann unter dem mittleren Bogen durch.","Torre Eiffel (París)":"Eiffelturm (Paris)","Ocupa 3×3 casillas y es altísima. Las vías pasan entre sus patas, por la fila o la columna del medio.":"Braucht 3×3 Felder und ist sehr hoch. Die Gleise gehen zwischen seinen Beinen durch, in der mittleren Reihe oder Spalte.","Tower Bridge (Londres)":"Tower Bridge (London)","Ocupa 5 casillas. Entre las dos torres caben 3 vías por debajo de las pasarelas.":"Braucht 5 Felder. Zwischen den beiden Türmen passen 3 Gleise unter die Stege.","Acueducto de Segovia":"Aquädukt von Segovia","6 arcos de piedra de 2 pisos: puede pasar una vía o una calle bajo cada arco.":"6 zweistöckige Steinbögen: Unter jedem Bogen kann ein Gleis oder eine Straße durch.","Ocupa 5 casillas. Las vías pasan por los tres arcos del centro.":"Braucht 5 Felder. Die Gleise gehen durch die drei mittleren Bögen.","Torii gigante (Japón)":"Riesiges Torii (Japan)","Gran puerta roja de 3 casillas. Una vía pasa por el centro.":"Ein großes rotes Tor, 3 Felder breit. Ein Gleis geht durch die Mitte.","Obelisco (Buenos Aires)":"Obelisk (Buenos Aires)","Alto y blanco, en el centro de la avenida 9 de Julio. Ocupa 1 casilla.":"Hoch und weiß, mitten auf der Avenida 9 de Julio. Braucht 1 Feld.","Big Ben (Londres)":"Big Ben (London)","La torre del reloj más famosa. Ocupa 1 casilla.":"Der berühmteste Uhrturm. Braucht 1 Feld.","Faro":"Leuchtturm","Faro de rayas rojas y blancas para la costa. Ocupa 1 casilla.":"Ein rot-weiß gestreifter Leuchtturm für die Küste. Braucht 1 Feld.","Monte con túnel":"Hügel mit Tunnel","Una colina de 3 casillas con un túnel por dentro: la vía pasa por debajo, en el piso 0.":"Ein Hügel über 3 Felder mit einem Tunnel innen drin: Das Gleis geht unten durch, im Stock 0.","Plaza":"Platz","Plaza (adoquines)":"Platz (Pflaster)","Suelo de adoquines. Arrastra el dedo para pintar muchas casillas. Encima se puede poner de todo.":"Gepflasterter Boden. Zieh den Finger, um viele Felder anzumalen. Du kannst alles daraufstellen.","Arena":"Sand","Arena de playa":"Strandsand","Suelo de playa. Arrastra para pintar.":"Strandboden. Zieh, um anzumalen.","Parque":"Park","Parque con flores":"Park mit Blumen","Césped con flores. Arrastra para pintar.":"Gras mit Blumen. Zieh, um anzumalen.","Nieve o sal":"Schnee oder Salz","Suelo blanco para montañas nevadas o salares. Arrastra para pintar.":"Weißer Boden für verschneite Berge oder Salzwüsten. Zieh, um anzumalen.","Campo de cultivo":"Acker","Campo de cultivo con surcos. Arrastra para pintar.":"Ein Acker mit Furchen. Zieh, um anzumalen.","Árbol":"Baum","Pino":"Kiefer","Palmera":"Palme","Cerezo en flor":"Kirschblüte","Flores":"Blumen","Girasol":"Sonnenblume","Montaña":"Berg","Vaca":"Kuh","Oveja":"Schaf","Pato":"Ente","Elefante":"Elefant","Llama":"Lama","Cactus":"Kaktus","Loro":"Papagei","Pingüino":"Pinguin","Casa":"Haus","Casa con jardín":"Haus mit Garten","Iglesia":"Kirche","Rascacielos":"Wolkenkratzer","Grandes almacenes":"Kaufhaus","Edificios":"Gebäude","Torre de Tokio":"Tokyo Tower","Castillo japonés":"Japanische Burg","Puerta torii":"Torii-Tor","Templo":"Tempel","Estatua de la Libertad":"Freiheitsstatue","Reloj (Big Ben)":"Uhr (Big Ben)","Noria":"Riesenrad","Montaña rusa":"Achterbahn","Tiovivo":"Karussell","Autobús":"Bus","Tuk-tuk":"Tuk-Tuk","Ferri":"Fähre","Velero":"Segelboot","Dragón":"Drache","Fuente":"Brunnen","Estadio":"Stadion","Museo":"Museum","Globo":"Ballon","Coche":"Auto","Coche de policía":"Polizeiauto","Camión de bomberos":"Feuerwehrauto","Locomotora de vapor":"Dampflok","Velocidad media. Echa mucho humo blanco, hace «chu-chu» y pita con su silbato.":"Mittelschnell. Viel weißer Rauch, macht „tschu-tschu“ und pfeift mit ihrer Pfeife.","Tren de pasajeros":"Personenzug","Rápido. Motor diésel con un poco de humo gris y bocina de dos notas.":"Schnell. Diesellok mit etwas grauem Rauch und einer Hupe mit zwei Tönen.","Tren de mercancías":"Güterzug","Lento y pesado. Humo oscuro, vagones que hacen «taca-taca» y bocina grave.":"Langsam und schwer. Dunkler Rauch, Wagen, die „ratter-ratter“ machen, und eine tiefe Hupe.","Tren bala":"Hochgeschwindigkeitszug","¡El más rápido! Sin humo: deja estelas de viento, hace «fiuuu» y toca una melodía.":"Der schnellste! Kein Rauch: Er hinterlässt Windstreifen, macht „wuuusch“ und spielt eine Melodie.","Metro (subte)":"U-Bahn","Rápido y eléctrico, perfecto para ir bajo tierra (piso −1). Hace un zumbido suave.":"Schnell und elektrisch, perfekt für unter der Erde (Stock −1). Sie summt leise.","Tranvía":"Straßenbahn","El más lento. Saca chispas eléctricas del techo y hace «ding-ding».":"Die langsamste. Aus ihrem Dach sprühen elektrische Funken und sie macht „bim-bim“.","Menos vagones":"Weniger Wagen","Más vagones":"Mehr Wagen","vagones":"Wagen","girar":"drehen","forma":"Form","seguir":"weiter","sube/baja":"hinauf/hinunter","Sube":"Hoch","Baja":"Runter","¿La pieza sube o baja?":"Geht das Teil hinauf oder hinunter?","Ahora SUBE ⬆️ desde el piso en el que estás.":"Jetzt geht es HINAUF ⬆️ von dem Stockwerk, auf dem du bist.","Ahora BAJA ⬇️ desde el piso en el que estás.":"Jetzt geht es HINUNTER ⬇️ von dem Stockwerk, auf dem du bist.","En marcha":"Unterwegs","Ahora solo puedes cambiar los desvíos con ✋ y tocar trenes y coches para que piten. Pulsa ⏸️ para seguir construyendo.":"Jetzt kannst du nur Weichen mit ✋ umstellen und Züge und Autos antippen, damit sie hupen. Drück ⏸️, um weiterzubauen.","✋ Toca un desvío para cambiarlo ·":"✋ Tippe eine Weiche an, um sie umzustellen ·","🎥 sigue al tren · 👀 ve montado · ⏸️ para construir":"🎥 dem Zug folgen · 👀 mitfahren · ⏸️ zum Bauen","📐 Vista de lado":"📐 Seitenansicht","Toca una vía con ✋ para ver su fila de frente.":"Tippe ein Gleis mit ✋ an, um seine Reihe von vorne zu sehen.","Así se ve de frente la franja amarilla del tablero. Los números son los pisos. La 🚂 es el tamaño del tren.":"Das ist der gelbe Streifen des Spielfelds von vorne gesehen. Die Zahlen sind die Stockwerke. Der 🚂 zeigt die Größe des Zuges.","💾 Proyectos y guardados":"💾 Projekte und Speicherstände","⭐ Proyectos listos para jugar":"⭐ Projekte zum Sofort-Spielen","Toca uno para cargarlo y pulsa ▶️. Todos traen trenes preparados.":"Tippe eins an, um es zu laden, und drück ▶️. Alle haben schon Züge.","📁 Mis circuitos":"📁 Meine Strecken","⚠️ Aquí no se puede guardar: esta vista no deja usar el almacenamiento del navegador. Abre constructor.html con doble clic para poder guardar.":"⚠️ Speichern geht hier nicht: Diese Ansicht kann den Speicher des Browsers nicht benutzen. Öffne das Spiel direkt im Browser, um zu speichern.","Nombre del circuito":"Name der Strecke","Guardar con este nombre":"Mit diesem Namen speichern","Escribe un nombre y pulsa 💾. Si el nombre ya existe, se sustituye.":"Gib einen Namen ein und drück 💾. Wenn es den Namen schon gibt, wird er ersetzt.","Todavía no hay circuitos guardados.":"Noch keine gespeicherten Strecken.","Borrar (toca dos veces)":"Löschen (zweimal tippen)","Mi circuito":"Meine Strecke ","🗑️ ¿Vaciar el tablero?":"🗑️ Das Spielfeld leeren?","Se quitan todas las piezas y los trenes. Los circuitos guardados no se borran.":"Alle Teile und Züge werden entfernt. Die gespeicherten Strecken bleiben.","Sí, vaciar":"Ja, leeren","❓ Cómo se juega":"❓ So wird gespielt","🎓 Empezar el tutorial paso a paso":"🎓 Die Anleitung Schritt für Schritt starten","Abajo hay pestañas: 🛤️ Vías, 🔀 Desvíos, ⛰️ Subir, 🚉 Especiales, 🌳 Campo, 🏙️ Ciudad, 🗼 Monumentos y 🚂 Trenes. Elige una pieza: encima verás su nombre y para qué sirve.":"Unten gibt es Reiter: 🛤️ Gleise, 🔀 Weichen, ⛰️ Rampen, 🚉 Besonderes, 🌳 Land, 🏙️ Stadt, 🗼 Denkmäler und 🚂 Züge. Wähl ein Teil: Darüber siehst du seinen Namen und was es macht.","Toca el tablero para ponerla. Se gira sola para encajar con la vía de al lado. Toca encima con la misma pieza para girarla, o con otra pieza para cambiarla (no hace falta borrar).":"Tippe auf das Spielfeld, um es hinzulegen. Es dreht sich von selbst passend zum Gleis daneben. Tippe mit demselben Teil darauf, um es zu drehen, oder mit einem anderen, um es auszutauschen (du musst nicht radieren).","El lápiz (pestaña 🛤️ Vías) dibuja la vía arrastrando el dedo: pone las rectas y las curvas solo.":"Der Stift (Reiter 🛤️ Gleise) zeichnet Gleise, während du den Finger ziehst: Er legt die Geraden und Kurven für dich.","Los puntos rojos que parpadean son vías sueltas: ¡ciérralas o el tren descarrilará!":"Die blinkenden roten Punkte sind offene Enden: Schließ sie, sonst entgleist der Zug!","Pestaña 🚂: elige un tren y los vagones (➖ ➕) y toca una vía. La flecha verde indica hacia dónde irá; toca el tren para darle la vuelta.":"Reiter 🚂: Wähl einen Zug und seine Wagen (➖ ➕) und tippe ein Gleis an. Der grüne Pfeil zeigt, wohin er fährt; tippe den Zug an, um ihn umzudrehen.","Pulsa ▶️ para arrancar. 🐢—🐇 cambia la velocidad. 🔄 vuelve a poner los trenes en su sitio.":"Drück ▶️ zum Starten. 🐢—🐇 ändert die Geschwindigkeit. 🔄 stellt die Züge zurück an ihren Start.","Con ✋ cambias los desvíos (también con los trenes en marcha) y mueves el tablero. Dos dedos, la rueda o ➕ ➖ para acercar y alejar.":"Mit ✋ stellst du Weichen um (auch während die Züge fahren) und verschiebst das Spielfeld. Zwei Finger, das Mausrad oder ➕ ➖ zum Vergrößern und Verkleinern.","Pisos: a la derecha, ⬆️ ⬇️ eligen el piso donde construyes. Bajo el suelo hay dos pisos de metro (−1 y −2): baja con una rampa ⬇️ Baja para hacer un subte. En la pestaña ⛰️ Rampas eliges ⬆️ Sube o ⬇️ Baja, y el piso de construcción sigue a la rampa solo. Si una rampa ya puesta va al revés, toca el botón amarillo ⇅ que sale encima. Mientras construyes, los pisos de arriba se ven transparentes.":"Stockwerke: Rechts wählst du mit ⬆️ ⬇️ das Stockwerk, auf dem du baust. Unter der Erde gibt es zwei U-Bahn-Stockwerke (−1 und −2): Fahr mit einer Rampe ⬇️ Runter hinunter, um eine U-Bahn zu bauen. Im Reiter ⛰️ Rampen wählst du ⬆️ Hoch oder ⬇️ Runter, und das Baustockwerk folgt der Rampe von selbst. Wenn eine Rampe falsch herum liegt, tippe auf den gelben Knopf ⇅ darüber. Beim Bauen sehen die Stockwerke darüber durchsichtig aus.","Espiral: pon 4 «curvas rampa» seguidas y el tren subirá dando una vuelta. Para bajar, otra espiral recorrida al revés. Mira el proyecto 🎢 Montaña rusa.":"Spirale: Leg 4 „Rampenkurven“ hintereinander, dann fährt der Zug im Kreis nach oben. Zum Hinunterfahren eine Spirale in die andere Richtung. Schau dir das Projekt 🎢 Achterbahn an.","Mientras el juego está en marcha (▶️) no se puede construir: solo cambiar desvíos con ✋ y tocar trenes y coches para que piten. Pulsa ⏸️ para construir.":"Während das Spiel läuft (▶️), kannst du nicht bauen: nur Weichen mit ✋ umstellen und Züge und Autos antippen, damit sie hupen. Drück ⏸️ zum Bauen.","Pestaña 🚗 Calles: dibuja calles, cruces y pasos a nivel y pon coches, taxis, autobuses… Andan solos, eligen camino en los cruces y esperan cuando bajan las barreras.":"Reiter 🚗 Straßen: Zeichne Straßen, Kreuzungen und Bahnübergänge und stell Autos, Taxis, Busse… dazu. Sie fahren von selbst, wählen an Kreuzungen ihren Weg und warten, wenn die Schranken runtergehen.","Pestaña 🏛️ Monumentos: monumentos grandes en 3D. Las vías pueden pasar por debajo de sus arcos (por ejemplo, entre las patas de la Torre Eiffel).":"Reiter 🏛️ Denkmäler: große 3D-Denkmäler. Gleise können unter ihren Bögen durch (zum Beispiel zwischen den Beinen des Eiffelturms).","Cada tren es distinto: el bala es el más rápido y no echa humo, el de vapor hace chu-chu con humo blanco, el de mercancías es lento y pesado, el tranvía saca chispas.":"Jeder Zug ist anders: Der Hochgeschwindigkeitszug ist der schnellste und hat keinen Rauch, die Dampflok macht tschu-tschu mit weißem Rauch, der Güterzug ist langsam und schwer, die Straßenbahn sprüht Funken.","El botón 🔧 busca las vías sueltas, donde el tren se caería, y te propone cómo arreglarlas: cambia una pieza mal puesta, añade vía (también rampas y espirales) y, si hace falta, quita alguna pieza para rehacer la unión. Si no quieres quitar piezas, elige 🛑 Solo topes. Acepta con ✔️ o quítalo con ✖️.":"Der Knopf 🔧 findet offene Enden, wo der Zug herunterfallen würde, und schlägt vor, wie man sie repariert: Er tauscht ein schlecht gelegtes Teil, legt Gleise dazu (auch Rampen und Spiralen) und nimmt wenn nötig ein paar Teile weg, um die Verbindung neu zu bauen. Wenn keine Teile weggenommen werden sollen, wähl 🛑 Nur Prellböcke. Bestätige mit ✔️ oder verwirf es mit ✖️.","Si dos trenes se tocan en el mismo piso, chocan. Si un tren llega a una vía suelta o al borde, descarrila: toca 🔄 para recolocarlo.":"Wenn sich zwei Züge im selben Stockwerk berühren, stoßen sie zusammen. Wenn ein Zug an ein offenes Ende oder an den Rand kommt, entgleist er: Tippe 🔄, um ihn zurückzustellen.","En 💾 hay proyectos de ciudades listos para jugar y puedes guardar tus circuitos con nombre.":"Bei 💾 gibt es fertige Stadt-Projekte zum Spielen, und du kannst deine Strecken mit einem Namen speichern.","👋 ¡Bienvenido!":"👋 Willkommen!","¿Quieres aprender a jugar paso a paso? El tutorial te enseña a construir un circuito, poner un tren y arrancarlo (tarda unos 3 minutos).":"Möchtest du Schritt für Schritt spielen lernen? Die Anleitung zeigt dir, wie man eine Strecke baut, einen Zug daraufstellt und losfährt (etwa 3 Minuten).","🎓 Sí, ¡enséñame!":"🎓 Ja, zeig es mir!","Ahora no":"Jetzt nicht","Empezar el tutorial":"Die Anleitung starten","¡Hola! Vamos a construir juntos un circuito de tren. Sigue las luces amarillas: te dicen qué tocar.":"Hallo! Wir bauen zusammen eine Eisenbahnstrecke. Folge den gelben Lichtern: Sie zeigen dir, was du antippen sollst.","¡Empezamos!":"Los geht's!","Abajo están las pestañas con las piezas. Toca la pestaña 🛤️ Vías.":"Unten sind die Reiter mit den Teilen. Tippe auf den Reiter 🛤️ Gleise.","Elige la curva.":"Nimm die Kurve.","Toca los 4 recuadros amarillos del tablero para poner las 4 curvas.":"Tippe auf die 4 gelben Kästchen auf dem Spielfeld, um die 4 Kurven hinzulegen.","¡Muy bien! Ahora elige la recta corta.":"Sehr gut! Jetzt nimm die kurze Gerade.","Pon rectas en los huecos amarillos. Los puntos rojos que parpadean son vías sueltas: cuando desaparecen, ¡el circuito está cerrado!":"Leg Geraden in die gelben Lücken. Die blinkenden roten Punkte sind offene Enden: Wenn sie verschwinden, ist die Strecke geschlossen!","Si te equivocas de pieza, no hace falta borrar: elige otra y tócala encima. Prueba: abre 🚉 Estación, elige la estación y toca las rectas de arriba.":"Wenn du das falsche Teil nimmst, musst du nicht radieren: Nimm ein anderes und tippe darauf. Probier es: Öffne 🚉 Bahnhof, nimm den Bahnhof und tippe auf die Geraden oben.","¡Ahora un tren! Abre la pestaña 🚂 Trenes, elige el que más te guste y toca la vía.":"Jetzt ein Zug! Öffne den Reiter 🚂 Züge, nimm den, der dir am besten gefällt, und tippe auf das Gleis.","La flecha verde dice hacia dónde irá (toca el tren para darle la vuelta). Pulsa ▶️ para arrancar.":"Der grüne Pfeil zeigt, wohin er fährt (tippe den Zug an, um ihn umzudrehen). Drück ▶️ zum Starten.","¡Chu-chu! Mientras el tren anda no se puede construir: solo cambiar desvíos. Cuando quieras, pulsa ⏸️ para parar.":"Tschu-tschu! Während der Zug fährt, kannst du nicht bauen: nur Weichen umstellen. Wann du willst, drück ⏸️ zum Anhalten.","Truco: con el lápiz ✏️ dibujas la vía arrastrando el dedo, y las curvas se ponen solas. Elige el lápiz y dibuja un camino que salga de la estación.":"Tipp: Mit dem Stift ✏️ zeichnest du Gleise, indem du den Finger ziehst, und die Kurven kommen von selbst. Nimm den Stift und zeichne einen Weg, der vom Bahnhof losgeht.","¡Ahora a subir y bajar! Abre la pestaña ⛰️ Rampas.":"Jetzt bauen wir hinauf und hinunter! Öffne den Reiter ⛰️ Rampen.","Pulsa ⬆️ Sube y elige la rampa.":"Drück ⬆️ Hoch und nimm die Rampe.","Pon la rampa en el recuadro amarillo, junto a la punta suelta. Fíjate: el número rojo dice en qué piso está cada punta.":"Leg die Rampe in das gelbe Kästchen, neben das offene Ende. Schau: Die rote Zahl sagt dir, in welchem Stockwerk jedes Ende ist.","¡Has subido al piso 1! Abre 🛤️ Vías y pon una recta corta en el recuadro de arriba. Toca justo al lado de la punta: la pieza se pone sola a su altura.":"Du bist in den 1. Stock hochgefahren! Öffne 🛤️ Gleise und leg eine kurze Gerade in das Kästchen oben. Tippe direkt neben das Ende: Das Teil stellt sich von selbst auf seine Höhe.","Para bajar: vuelve a ⛰️ Rampas, pulsa ⬇️ Baja y pon la rampa en el recuadro.":"Zum Hinunterfahren: Geh zurück zu ⛰️ Rampen, drück ⬇️ Runter und leg die Rampe in das Kästchen.","Toca 📐 para verlo de lado: la vía sube al piso 1 y vuelve a bajar. Truco: al tocar una rampa, ➕ seguir pone la siguiente ya unida y ↰ forma la cambia de recta a curva.":"Tippe auf 📐, um es von der Seite zu sehen: Das Gleis steigt in den 1. Stock und kommt wieder herunter. Trick: Wenn du eine Rampe antippst, setzt ➕ weiter die nächste schon verbunden an, und ↰ Form macht aus einer Geraden eine Kurve.","¡Ya sabes lo básico! ⬆️ ⬇️ cambian de piso para hacer puentes y espirales, ❓ tiene la ayuda y en 💾 hay ciudades listas para jugar.":"Jetzt kannst du das Wichtigste! ⬆️ ⬇️ wechseln das Stockwerk für Brücken und Spiralen, bei ❓ gibt es Hilfe und bei 💾 fertige Städte zum Spielen.","🗺️ ¡A la aventura!":"🗺️ Auf ins Abenteuer!","🏁 Terminar":"🏁 Fertig","↩️ Volver a mi circuito":"↩️ Zurück zu meiner Strecke","✖️ Salir del tutorial":"✖️ Anleitung verlassen","🌎 Sudamérica":"🌎 Südamerika","🏝️ Tu pueblo":"🏝️ Dein Dorf","🇪🇸 España":"🇪🇸 Spanien","Volver al mapa":"Zurück zur Karte","Empezar el nivel de nuevo":"Das Level neu starten","▶️ ¡A construir!":"▶️ Los, bauen!","🎉 ¡Conseguido!":"🎉 Geschafft!","¡Conseguido!":"Geschafft!","Una estrella":"Ein Stern","Dos estrellas":"Zwei Sterne","Tres estrellas":"Drei Sterne","⭐ Llegaste a la 🏁":"⭐ Du bist bei der 🏁 angekommen","⭐ Cogiste todas las 🪙":"⭐ Du hast alle 🪙 eingesammelt","☆ Te faltó alguna 🪙":"☆ Dir hat eine 🪙 gefehlt","▶️ Siguiente":"▶️ Weiter","Siguiente nivel":"Nächstes Level","🔁 Repetir":"🔁 Nochmal","Repetir el nivel":"Das Level nochmal spielen","🗺️ Mapa":"🗺️ Karte","🏆 ¡Has terminado toda la aventura! Un mayor puede empezar de cero desde 👨‍👩‍👧 (en el mapa).":"🏆 Du hast das ganze Abenteuer geschafft! Ein Erwachsener kann bei 👨‍👩‍👧 (auf der Karte) von vorne anfangen.","Pueblo":"Dorf","París":"Paris","Londres":"London","Ámsterdam":"Amsterdam","Los Alpes":"Die Alpen","Hong Kong":"Hongkong","Río de Janeiro":"Rio de Janeiro","Café de Colombia":"Kaffee aus Kolumbien","Nariz del Diablo":"Teufelsnase","Salar de Uyuni":"Salzsee von Uyuni","Los Andes":"Die Anden","La primera vía":"Das erste Gleis","La curva":"Die Kurve","El bosque":"Der Wald","El desvío":"Die Weiche","Las vacas":"Die Kühe","Lleva el tren desde la estación A hasta la 🏁. Pon rectas en el hueco y pulsa ▶️.":"Bring den Zug vom Bahnhof A zur 🏁. Leg Geraden in die Lücke und drück ▶️.","La 🏁 está arriba. Usa curvas para girar.":"Die 🏁 ist oben. Nimm Kurven zum Abbiegen.","Un bosque tapa el camino. Rodéalo por arriba o por abajo. ¡Recoge la 🪙!":"Ein Wald versperrt den Weg. Fahr oben oder unten herum. Sammle die 🪙 ein!","Cierra el hueco de arriba. Primero deja el desvío recto: el tren irá hasta el tope, cogerá la 🪙 y volverá. Entonces toca el desvío con ✋ para que vaya a la 🏁.":"Schließ die Lücke oben. Lass die Weiche zuerst geradeaus: Der Zug fährt bis zum Prellbock, sammelt die 🪙 ein und kommt zurück. Dann tippe die Weiche mit ✋ an, damit er zur 🏁 fährt.","Las vacas cruzan la vía. El tren frena para no atropellarlas: ¡ten paciencia y espera a que pasen!":"Die Kühe laufen über die Gleise. Der Zug bremst, damit er sie nicht anfährt: Hab Geduld und warte, bis sie vorbei sind!","Para llegar a la 🏁 hay que pasar por debajo de uno de los arcos de la Puerta de Alcalá.":"Um zur 🏁 zu kommen, musst du unter einem der Bögen der Puerta de Alcalá durchfahren.","El acueducto romano tiene muchos arcos. Haz que la vía pase por debajo de uno.":"Das römische Aquädukt hat viele Bögen. Lass das Gleis unter einem davon durchgehen.","El río Guadalquivir corta el camino. Sube con una rampa (⬆️ Sube), cruza por el piso 1 y baja con otra rampa (⬇️ Baja).":"Der Fluss Guadalquivir versperrt den Weg. Fahr mit einer Rampe hoch (⬆️ Hoch), über den 1. Stock hinüber und mit einer anderen Rampe wieder runter (⬇️ Runter).","¡Cuidado! Un tren de mercancías da vueltas sin parar y cruza tu camino dos veces. Construye la vía y pulsa ▶️ en el momento justo para no chocar.":"Achtung! Ein Güterzug fährt ohne Pause im Kreis und kreuzt zweimal deinen Weg. Bau die Strecke und drück ▶️ genau im richtigen Moment, damit ihr nicht zusammenstoßt.","Una calle con coches corta el camino. Pon un paso a nivel encima de la calle: ¡las barreras pararán a los coches!":"Eine Straße mit Autos versperrt den Weg. Leg einen Bahnübergang auf die Straße: Die Schranken halten die Autos an!","¡La Torre Eiffel! La vía puede pasar por debajo, entre sus patas.":"Der Eiffelturm! Das Gleis kann unten durch, zwischen seinen Beinen.","Cruza el río Támesis por el piso 1, entre las torres del Tower Bridge.":"Fahr im 1. Stock über die Themse, zwischen den Türmen der Tower Bridge.","¡Dos trenes! Lleva cada uno a su 🏁 sin que choquen. Truco: haz que uno pase por encima del otro.":"Zwei Züge! Bring jeden zu seiner 🏁, ohne dass sie zusammenstoßen. Trick: Lass einen über den anderen fahren.","La 🏁 está en lo alto de la montaña, en el piso 2. ¡Sube con rampas o con una espiral!":"Die 🏁 ist oben auf dem Berg, im 2. Stock. Fahr mit Rampen oder einer Spirale hoch!","Arriba hay una ciudad llena de edificios y coches. ¡Pasa por debajo con el subte! Pon una rampa con ⬇️ Baja para entrar bajo tierra (piso menos uno), cruza bajo la calle y sube con otra rampa ⬆️ Sube.":"Oben ist eine Stadt voller Häuser und Autos. Fahr mit der U-Bahn darunter durch! Leg eine Rampe mit ⬇️ Runter, um unter die Erde zu kommen (Stock minus eins), fahr unter der Straße durch und mit einer anderen Rampe ⬆️ Hoch wieder rauf.","Tu tranvía tiene que ir por la rambla, junto a los coches. Cambia la calle por la calle con vías 🚋: tócala encima. El tranvía espera si un coche va delante.":"Deine Straßenbahn muss über die Uferstraße fahren, neben den Autos. Tausch die Straße gegen die Straße mit Schienen 🚋: Tippe darauf. Die Straßenbahn wartet, wenn ein Auto vor ihr fährt.","En Asunción el tren cruza dos calles llenas de coches. Pon pasos a nivel encima de las calles y, si quieres, una estación en el medio para los pasajeros.":"In Asunción fährt der Zug über zwei Straßen voller Autos. Leg Bahnübergänge auf die Straßen und, wenn du willst, einen Bahnhof in die Mitte für die Fahrgäste.","Río tiene mucho tráfico. Pon pasos a nivel encima de las calles para cruzarlas, y cuidado con el tranvía que da vueltas: ¡pulsa ▶️ en el momento justo!":"In Rio ist viel Verkehr. Leg Bahnübergänge auf die Straßen, um sie zu überqueren, und pass auf die Straßenbahn auf, die im Kreis fährt: Drück ▶️ genau im richtigen Moment!","¡Vacas y un tren de mercancías! Las vacas te hacen frenar y el otro tren cruza tu vía dos veces. Pulsa ▶️ en el momento justo para no chocar.":"Kühe und ein Güterzug! Die Kühe bringen dich zum Bremsen und der andere Zug kreuzt zweimal dein Gleis. Drück ▶️ genau im richtigen Moment, damit ihr nicht zusammenstoßt.","La selva es muy espesa. El único camino pasa por dentro de los montes, por sus túneles. ¡Usa piezas largas para gastar pocas!":"Der Dschungel ist sehr dicht. Der einzige Weg führt durch die Berge, durch ihre Tunnel. Nimm lange Teile, dann brauchst du weniger!","El Salto Ángel es la cascada más alta del mundo. La 🏁 está arriba de la montaña, en el piso 3: sube con rampas ⬆️ Sube.":"Der Salto Ángel ist der höchste Wasserfall der Welt. Die 🏁 ist oben auf dem Berg, im 3. Stock: Fahr mit Rampen ⬆️ Hoch hinauf.","Dos desvíos en las montañas del café. Para coger las dos 🪙, deja primero los desvíos rectos y cámbialos con ✋ uno a uno. ¡Después llega a la 🏁!":"Zwei Weichen in den Kaffeebergen. Um beide 🪙 einzusammeln, lass die Weichen zuerst geradeaus und stell sie dann mit ✋ eine nach der anderen um. Danach fahr zur 🏁!","La Nariz del Diablo es un tren que sube la montaña en zigzag. El tren entra en la vía muerta y da marcha atrás: entonces cambia el desvío con ✋ para que suba hacia la 🏁.":"Die Teufelsnase ist ein Zug, der im Zickzack den Berg hinauffährt. Der Zug fährt auf das Abstellgleis und setzt zurück: Dann stell die Weiche mit ✋ um, damit er zur 🏁 hinauffährt.","Machu Picchu está en lo alto de la montaña, ¡en el piso 4! Sube dando vueltas con 4 curvas rampa seguidas, como una espiral.":"Machu Picchu liegt hoch oben auf dem Berg, im 4. Stock! Fahr im Kreis hoch mit 4 Rampenkurven hintereinander, wie eine Spirale.","El salar de Uyuni es un desierto de sal blanca enorme. El camino es muy largo: usa rectas largas y curvas grandes para gastar pocas piezas.":"Der Salzsee von Uyuni ist eine riesige weiße Salzwüste. Der Weg ist sehr lang: Nimm lange Geraden und große Kurven, dann brauchst du wenige Teile.","Para cruzar los Andes hay que subir muy alto: ¡hasta el piso 2! Así pasas por encima de las montañas y del otro tren. Después baja con ⬇️ Baja.":"Um über die Anden zu kommen, musst du ganz hoch hinauf: bis in den 2. Stock! So fährst du über die Berge und über den anderen Zug. Danach fahr mit ⬇️ Runter wieder hinunter.","¡El fin del mundo! Dos trenes tienen que cruzar la bahía: uno por encima del agua y el otro por debajo, como un subte. Lleva cada uno a su 🏁.":"Das Ende der Welt! Zwei Züge müssen über die Bucht: einer über dem Wasser und der andere darunter, wie eine U-Bahn. Bring jeden zu seiner 🏁.","Un pueblo con campos y vacas, un lago, un parque con fuente, calles con coches, el acueducto y un tren de vapor con apartadero.":"Ein Dorf mit Feldern und Kühen, ein See, ein Park mit Brunnen, Straßen mit Autos, das Aquädukt und eine Dampflok mit Abstellgleis.","Tren bala por el túnel del monte Fuji nevado, un tranvía que sube dos pisos, el metro bajo la ciudad y taxis por las calles.":"Ein Hochgeschwindigkeitszug durch den Tunnel im verschneiten Fuji, eine Straßenbahn, die zwei Stockwerke hochfährt, die U-Bahn unter der Stadt und Taxis auf den Straßen.","Metro elevado sobre la línea de mercancías, el metro bajo los rascacielos, Central Park, taxis amarillos y la Estatua de la Libertad.":"Eine Hochbahn über der Güterstrecke, die U-Bahn unter den Wolkenkratzern, der Central Park, gelbe Taxis und die Freiheitsstatue.","El tren de vapor cruza el Támesis entre las torres del Tower Bridge, el Big Ben, Hyde Park, autobuses rojos y el metro bajo el río.":"Die Dampflok fährt zwischen den Türmen der Tower Bridge über die Themse, dazu Big Ben, der Hyde Park, rote Busse und die U-Bahn unter dem Fluss.","El TGV pasa entre las patas de la Torre Eiffel y bajo el Arco del Triunfo, el metro bajo la ciudad, la playa del Sena y el Louvre.":"Der TGV fährt zwischen den Beinen des Eiffelturms und unter dem Triumphbogen durch, dazu die Metro unter der Stadt, der Strand an der Seine und der Louvre.","El metro sube dos pisos por encima del tranvía, que va por la calle entre coches, junto al puerto con su faro y sus barcos.":"Die U-Bahn fährt zwei Stockwerke über der Straßenbahn, die zwischen den Autos auf der Straße fährt, neben dem Hafen mit Leuchtturm und Schiffen.","Tren elevado sobre el río, una vía de apartadero con estación (cambia el desvío con ✋), tuk-tuks por las calles y un tren de vapor alrededor del templo.":"Eine Hochbahn über dem Fluss, ein Abstellgleis mit Bahnhof (stell die Weiche mit ✋ um), Tuk-Tuks auf den Straßen und eine Dampflok rund um den Tempel.","El Obelisco en la avenida 9 de Julio llena de coches, el subte con cuatro estaciones bajo la ciudad, el tren alrededor, Palermo, la Bombonera y el Río de la Plata.":"Der Obelisk auf der vollen Avenida 9 de Julio, die U-Bahn mit vier Stationen unter der Stadt, der Zug drumherum, Palermo, die Bombonera und der Río de la Plata.","El tranvía por la avenida junto a la playa, el tren que sube en espiral al Corcovado, el Pan de Azúcar, el faro y el Maracaná.":"Die Straßenbahn auf der Strandpromenade, der Zug, der in einer Spirale auf den Corcovado fährt, der Zuckerhut, der Leuchtturm und das Maracanã.","Un parque de atracciones: el tren sube en espiral 8 pisos y baja a toda velocidad, con trenecito, noria, tiovivos y globos.":"Ein Freizeitpark: Der Zug fährt in einer Spirale 8 Stockwerke hoch und rast wieder hinunter, dazu eine kleine Bahn, ein Riesenrad, Karussells und Ballons.","👨‍👩‍👧 Solo para mayores":"👨‍👩‍👧 Nur für Erwachsene","Para entrar, resuelve esta suma:":"Um hineinzukommen, rechne diese Aufgabe:","👨‍👩‍👧 Página para padres":"👨‍👩‍👧 Seite für Eltern","⚠️ En esta vista el navegador no deja guardar nada: el progreso y los ajustes se pierden al cerrar. Abre constructor.html con doble clic para que se guarden.":"⚠️ In dieser Ansicht kann der Browser nichts speichern: Fortschritt und Einstellungen gehen beim Schließen verloren. Öffne das Spiel direkt im Browser, damit sie erhalten bleiben.","⭐ Progreso de la aventura":"⭐ Fortschritt im Abenteuer","🔓 Abrir todos los niveles":"🔓 Alle Level freischalten","🔒 Volver a cerrar los niveles":"🔒 Die Level wieder sperren","Abrir o cerrar todos los niveles":"Alle Level freischalten oder sperren","🧹 Empezar la aventura de cero":"🧹 Das Abenteuer von vorne beginnen","Borrar todas las estrellas":"Alle Sterne löschen","🧹 ¿Empezar la aventura de cero?":"🧹 Das Abenteuer von vorne beginnen?","Se borran todas las estrellas y los niveles vuelven a cerrarse. Los circuitos del juego libre no se tocan.":"Alle Sterne werden gelöscht und die Level wieder gesperrt. Die Strecken aus dem freien Spiel bleiben.","Se borran todas las estrellas y los niveles vuelven a cerrarse con candado. Tus circuitos del juego libre no se tocan.":"Alle Sterne werden gelöscht und die Level wieder mit einem Schloss gesperrt. Deine Strecken aus dem freien Spiel bleiben.","Sí, empezar de cero":"Ja, von vorne beginnen","Ahora todos los niveles están abiertos, aunque no tengan estrellas.":"Jetzt sind alle Level offen, auch ohne Sterne.","Los niveles se abren uno a uno al conseguir al menos 1 estrella en el anterior.":"Die Level öffnen sich eins nach dem anderen, wenn du im vorherigen mindestens 1 Stern bekommst.","💾 Circuitos guardados":"💾 Gespeicherte Strecken","No hay circuitos guardados.":"Keine gespeicherten Strecken.","🗑️ Borrar todos los circuitos guardados":"🗑️ Alle gespeicherten Strecken löschen","Borrar todos los guardados":"Alle Speicherstände löschen","🗑️ ¿Borrar todos los circuitos guardados?":"🗑️ Alle gespeicherten Strecken löschen?","🧱 Vaciar el tablero del juego libre":"🧱 Das Spielfeld im freien Spiel leeren","Vaciar el juego libre":"Freies Spiel leeren","🧱 ¿Vaciar el tablero del juego libre?":"🧱 Das Spielfeld im freien Spiel leeren?","Se quitan todas las piezas y trenes del juego libre (los circuitos guardados no se tocan).":"Alle Teile und Züge im freien Spiel werden entfernt (die gespeicherten Strecken bleiben).","🎓 Tutorial":"🎓 Anleitung","🎓 Empezar el tutorial ahora":"🎓 Die Anleitung jetzt starten","🔁 Ofrecerlo otra vez al entrar al juego libre":"🔁 Beim Start des freien Spiels wieder anbieten","Volver a ofrecer el tutorial":"Die Anleitung wieder anbieten","🔊 Sonido y voz":"🔊 Ton und Stimme","Sonidos (trenes, pitos, golpes)":"Geräusche (Züge, Pfeifen, Zusammenstöße)","Voz que lee las consignas":"Stimme, die die Aufgaben vorliest","El botón 🔊 de arriba también apaga todo de golpe.":"Der Knopf 🔊 oben schaltet auch alles auf einmal aus.","Hola. Así suena la voz.":"Hallo. So klingt die Stimme.","✖️ Cerrar":"✖️ Schließen","🌐 Idioma":"🌐 Sprache","Aceptar el arreglo":"Die Reparatur annehmen","✔️ ¡Arréglalo!":"✔️ Reparier es!","Quitar la propuesta":"Den Vorschlag entfernen","¡Todo está bien! No hay vías sueltas: el tren no se caerá.":"Alles in Ordnung! Es gibt keine offenen Enden: Der Zug fällt nicht herunter.","🐄 ¡Muu!":"🐄 Muh!","ESPAÑA":"SPANIEN","FRANCIA":"FRANKREICH","REINO UNIDO":"VEREINIGTES KÖNIGREICH","IRLANDA":"IRLAND","ALEMANIA":"DEUTSCHLAND","ITALIA":"ITALIEN","SUIZA":"SCHWEIZ","PAÍSES BAJOS":"NIEDERLANDE","ÁFRICA":"AFRIKA","OCÉANO ATLÁNTICO":"ATLANTISCHER OZEAN","OCÉANO PACÍFICO":"PAZIFISCHER OZEAN","BRASIL":"BRASILIEN","PERÚ":"PERU","BOLIVIA":"BOLIVIEN","COLOMBIA":"KOLUMBIEN","SURINAM":"SURINAME","GUAYANA FR.":"FRZ.-GUAYANA","ARGENTINA":"ARGENTINIEN","Sudamérica":"Südamerika","España":"Spanien","Tu pueblo":"Dein Dorf","No":"Nein","¡Mira qué vía has dibujado!":"Schau dir das Gleis an, das du gezeichnet hast!","¡Ya sabes lo básico! ❓ tiene la ayuda y en 💾 hay ciudades listas para jugar. Cuando seas mayor, aprende a subir y bajar con el tutorial ⛰️.":"Jetzt kannst du das Wichtigste! Bei ❓ gibt es Hilfe und bei 💾 fertige Städte zum Spielen. Wenn du größer bist, lern mit der ⛰️-Anleitung, hinauf- und hinunterzufahren.","Vamos a aprender a construir hacia arriba: rampas, puentes y una espiral, como una montaña rusa.":"Wir lernen, in die Höhe zu bauen: Rampen, Brücken und eine Spirale, wie bei einer Achterbahn.","¡Vamos a construir hacia arriba! Abre la pestaña ⛰️ Rampas.":"Wir bauen in die Höhe! Öffne den Reiter ⛰️ Rampen.","¡Ahora una espiral! En ⛰️ Rampas pulsa ⬆️ Sube y elige la curva rampa.":"Jetzt eine Spirale! Drück bei ⛰️ Rampen auf ⬆️ Hoch und nimm die Rampenkurve.","Pon la curva rampa en el recuadro amarillo, junto a la punta suelta.":"Leg die Rampenkurve in das gelbe Kästchen, neben das offene Ende.","Ahora toca el botón verde ➕ seguir de la curva: pone otra igual, ya unida y un piso más arriba. Púlsalo hasta llenar los recuadros.":"Tippe jetzt auf den grünen Knopf ➕ weiter an der Kurve: Er setzt noch eine an, schon verbunden und ein Stockwerk höher. Drück weiter, bis die Kästchen voll sind.","¡Una espiral! Cuatro curvas rampa dan una vuelta entera y suben cuatro pisos.":"Eine Spirale! Vier Rampenkurven drehen sich einmal ganz herum und steigen vier Stockwerke hoch.","Arriba la vía se acaba. Abre 🚉 Estación y pon un tope en el recuadro: el tren se parará allí y volverá marcha atrás.":"Oben endet das Gleis. Öffne 🚉 Bahnhof und leg einen Prellbock in das Kästchen: Der Zug hält dort und fährt rückwärts zurück.","Pon un tren en la vía de abajo y pulsa ▶️ para verlo subir por la espiral.":"Stell unten einen Zug auf das Gleis und drück ▶️, dann siehst du, wie er die Spirale hochfährt.","¡Mira cómo sube y baja! Cuando quieras, pulsa ⏸️ para parar.":"Schau, wie er hoch- und runterfährt! Wann du willst, drück ⏸️ zum Anhalten.","¡Ya sabes subir y bajar! Con rampas haces puentes sobre ríos y calles, y con espirales subes muy alto. ¡Pruébalo en la aventura, en Machu Picchu!":"Jetzt kannst du hinauf- und hinunterfahren! Mit Rampen baust du Brücken über Flüsse und Straßen, und mit Spiralen kommst du ganz hoch. Probier es im Abenteuer aus, bei Machu Picchu!","Subir y bajar":"Hinauf und hinunter","⛰️ Subir y bajar":"⛰️ Hinauf und hinunter","🎓 Aprender a jugar":"🎓 Spielen lernen","Rampas, puentes y espirales. Para niños más mayores.":"Rampen, Brücken und Spiralen. Für größere Kinder.","Piezas, trenes y el lápiz. Para empezar.":"Teile, Züge und der Stift. Für den Anfang.","Corazón":"Herz","Pez":"Fisch","Gato":"Katze","Persona":"Mensch","Estrella":"Stern","Dibujos":"Bilder","✨ Hazlo tú":"✨ Mach du es","🎨 Dibujos con vías":"🎨 Gleisbilder","Dibujos con vías":"Gleisbilder","🎨 Otro dibujo":"🎨 Noch ein Bild","Elige un dibujo: lo haces con vías y luego el tren da la vuelta.":"Wähl ein Bild: Du baust es aus Gleisen und dann fährt der Zug darum herum.","Haz un elefante, un gato o un corazón con vías, y el tren da la vuelta.":"Bau einen Elefanten, eine Katze oder ein Herz aus Gleisen, und der Zug fährt darum herum.","Vía en diagonal":"Schräges Gleis","Vía en diagonal (al otro lado)":"Schräges Gleis (andersherum)","Diagonal larga":"Lange Schräge","Diagonal larga (al otro lado)":"Lange Schräge (andersherum)","Se desplaza una casilla hacia un lado. Pon varias seguidas para hacer una línea inclinada, como la trompa de un elefante. Tócala con la misma pieza o con ✋ para girarla: tiene 8 posiciones. El lápiz ✏️ también las pone solo al dibujar líneas inclinadas.":"Rückt um ein Feld zur Seite. Leg mehrere hintereinander, dann wird es eine schräge Linie, wie der Rüssel eines Elefanten. Tippe es mit demselben Teil oder mit ✋ an, um es zu drehen: Es hat 8 Stellungen. Der Stift ✏️ legt sie auch von selbst, wenn du schräge Linien zeichnest.","Como la diagonal, pero hacia el otro lado. Pon varias seguidas para hacer una línea inclinada.":"Wie die Schräge, aber andersherum. Leg mehrere hintereinander, dann wird es eine schräge Linie.","Una diagonal más suave, de 3 casillas de largo. Muy buena para trenes rápidos. Tócala para girarla: tiene 8 posiciones.":"Eine sanftere Schräge, 3 Felder lang. Super für schnelle Züge. Tippe sie an, um sie zu drehen: Sie hat 8 Stellungen.","La diagonal larga hacia el otro lado.":"Die lange Schräge, andersherum.","Suelo gris":"Grauer Boden","Suelo rosa":"Rosa Boden","Suelo naranja":"Oranger Boden","Suelo azul":"Blauer Boden","Suelo amarillo":"Gelber Boden","Suelo marrón":"Brauner Boden","Pinta el suelo de color. Arrastra el dedo para pintar muchas casillas.":"Malt den Boden in einer Farbe an. Zieh den Finger, um viele Felder anzumalen.","Conejo":"Hase","Tortuga":"Schildkröte","Manzana":"Apfel","Helado":"Eis","Fresa":"Erdbeere","Cohete":"Rakete","Barco":"Boot","Suelo rojo":"Roter Boden","Ciudades":"Städte","Animales":"Tiere","Comida":"Essen","Cosas":"Sachen","Biblioteca":"Bibliothek","📚 Biblioteca":"📚 Bibliothek","Elige una carpeta. Toca un dibujo y constrúyelo en el juego libre, o deja que lo haga yo.":"Wähl einen Ordner. Tippe ein Bild an und bau es im freien Spiel, oder lass es mich machen.","Ciudades, animales, comida y cosas para construir y jugar.":"Städte, Tiere, Essen und Sachen zum Bauen und Spielen.","1 unión":"1 Verbindung","Unir la vía":"Das Gleis verbinden","Solo topes":"Nur Prellböcke","Si no quieres quitar piezas, elige solo topes.":"Wenn keine Teile weggenommen werden sollen, wähl nur Prellböcke.","¡Muu!":"Muh!","¡Bonk! La barrera estaba subida. Bájala cuando venga el tren.":"Bums! Die Schranke war offen. Mach sie zu, wenn der Zug kommt.","¡Fuego apagado! ¡Muy bien, bomberos!":"Das Feuer ist aus! Gut gemacht, Feuerwehr!","¡Sale el sol!":"Die Sonne kommt raus!","¡Llueve! Los trenes van más despacio. Si llueve mucho, el río se desborda: sube las vías con rampas.":"Es regnet! Die Züge fahren langsamer. Wenn es viel regnet, tritt der Fluss über: Heb die Gleise mit Rampen an.","¡Nieva! Si la nieve tapa la vía, tócala para quitarla.":"Es schneit! Wenn Schnee auf dem Gleis liegt, tippe ihn an, um ihn wegzuräumen.","¡Mucho viento! Si cae un árbol en la vía, tócalo y la grúa lo quita.":"Ganz viel Wind! Wenn ein Baum auf das Gleis fällt, tippe ihn an, dann holt ihn der Kran weg.","¡El río se ha desbordado! Los trenes no pueden pasar por el agua. Haz un puente con rampas o pon el sol.":"Der Fluss ist über die Ufer getreten! Die Züge können nicht durchs Wasser. Bau eine Brücke mit Rampen oder lass die Sonne scheinen.","¡Fuego! Los bomberos ya van para allá.":"Feuer! Die Feuerwehr ist unterwegs.","¡Fuego! Pulsa ▶️ y los bomberos irán por la calle a apagarlo.":"Feuer! Drück ▶️, dann fährt die Feuerwehr die Straße entlang und löscht es.","¡Fuego! No hay calle para los bomberos: tócalo con ✋ para echarle agua, o dibuja una calle hasta aquí.":"Feuer! Es gibt keine Straße für die Feuerwehr: Tippe es mit ✋ an, um Wasser zu spritzen, oder zeichne eine Straße bis hierher.","¡Demasiado rápido en la curva! Usa el turbo en las rectas.":"Zu schnell in der Kurve! Nimm den Turbo auf den Geraden.","¡Toca las cajas para cargarlas en el tren!":"Tippe die Kisten an, um sie in den Zug zu laden!","¡Toca a los pasajeros para que suban al tren!":"Tippe die Fahrgäste an, damit sie in den Zug steigen!","¡Buenas noches! Los trenes encienden sus luces.":"Gute Nacht! Die Züge machen ihre Lichter an.","¡Es tuyo!":"Es gehört dir! ","Gana monedas llevando pasajeros 🧍 y cajas 📦 de una estación a otra: cuando el tren para, toca a la gente o las cajas para subirlas.":"Verdiene Münzen, indem du Fahrgäste 🧍 und Kisten 📦 von einem Bahnhof zum anderen bringst: Wenn der Zug hält, tippe die Leute oder Kisten an, um sie einzuladen.","✅ Es tuyo":"✅ Gehört dir","¡Esto es de la versión completa!":"Das gehört zur Vollversion!","Pide a un mayor que lo mire contigo.":"Frag einen Erwachsenen, ob er es sich mit dir ansieht.","Llamar a un mayor":"Einen Erwachsenen holen","Vale":"OK","Esto es de la versión completa. Pide a un mayor que lo mire contigo.":"Das gehört zur Vollversion. Frag einen Erwachsenen, ob er es
