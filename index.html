#drive.dr2 .dial { position: absolute; left: 0; top: 62px; width: 148px; height: 148px; border-radius: 50%; touch-action: none; cursor: grab;
  background: conic-gradient(from 225deg, #ffb340 0, #ff5e3a var(--p, 135deg), #e6eef5 var(--p, 135deg), #e6eef5 270deg, transparent 270deg);
  box-shadow: 0 8px 22px rgba(30,60,90,.3); -webkit-mask: radial-gradient(circle, transparent 40px, #000 41px); mask: radial-gradient(circle, transparent 40px, #000 41px); }
#drive.dr2 .dial { -webkit-mask: none; mask: none; }
#drive.dr2 .dial::before { content: ""; position: absolute; inset: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 2px 6px rgba(30,60,90,.15); }
#drive.dr2 .knob { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
#drive.dr2 .knob::after { content: ""; position: absolute; left: -11px; top: -74px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid #ff5e3a; box-shadow: 0 2px 6px rgba(0,0,0,.3); box-sizing: border-box; }
#drive.dr2 .dc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; font-size: 32px; background: #fff; box-shadow: none; }
#drive.dr2 .dial.stopped .dc { background: #e6f7e9; }
body.playing.driving #hzPlay { bottom: calc(230px + env(safe-area-inset-bottom)) !important; }
@media (max-height: 500px) { #drive.dr2 { transform: scale(.78); } body.playing.driving #hzPlay { bottom: calc(180px + env(safe-area-inset-bottom)) !important; } }

/* riding in the cab: only what's needed — play/pause, the throttle and the camera buttons */
body.cab #top .grp:not(:first-child), body.cab #top .grp > :not(#play), body.cab #daily, body.cab #side > :not(#camBox), body.cab #lvlbar { display: none !important; }
body.cab #top .grp:first-child { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 0; }
body.cab #side { top: calc(12px + env(safe-area-inset-top)); bottom: auto !important; transform: none; }
/* a smaller throttle */
#drive.dr2 { width: 172px; height: 172px; }
#drive.dr2 > .b { width: 40px; height: 40px; font-size: 18px; }
#drive.dr2 [data-a="horn"] { left: 2px; top: 2px; } #drive.dr2 [data-a="turbo"] { left: 56px; top: 2px; } #drive.dr2 [data-a="jump"] { left: 104px; top: 24px; }
#drive.dr2 [data-a="rev"] { left: 128px; top: 72px; } #drive.dr2 [data-a="close"] { left: 134px; top: 124px; width: 34px; height: 34px; font-size: 14px; }
#drive.dr2 .dial { top: 52px; width: 120px; height: 120px; }
#drive.dr2 .dial::before { inset: 15px; }
#drive.dr2 .knob::after { left: -9px; top: -60px; width: 18px; height: 18px; border-width: 3px; }
#drive.dr2 .dc { width: 62px; height: 62px; font-size: 26px; }
body.playing.driving #hzPlay { bottom: calc(190px + env(safe-area-inset-bottom)) !important; }
@media (max-height: 500px) { #drive.dr2 { transform: scale(.75); } body.playing.driving #hzPlay { bottom: calc(140px + env(safe-area-inset-bottom)) !important; } }

// =====================================================================
//  PARENTS' PAGE (behind a small sum, so little ones don't wander in)
// =====================================================================
function parentGate(then) {
  const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7), ok = a + b;
  const opts = [ok, ok + 1, ok - 2, ok + 3].sort(() => Math.random() - .5);
  openModal(card => {
    h2(card, "👨‍👩‍👧 Solo para mayores");
    addEl(card, "p", "", "Para entrar, resuelve esta suma:").style.fontSize = "18px";
    const q = addEl(card, "div", "", `${a} + ${b} = ?`); q.style.cssText = "font-size:46px;font-weight:900;text-align:center;margin:10px 0";
    const row = addEl(card, "div", "saveRow"); row.style.justifyContent = "center";
    opts.forEach(n => {
      const bt = mkBtn(String(n), "Respuesta " + n, () => { if (n === ok) { sfx.click(); then(); } else { sfx.no(); wobble(q); setTimeout(() => parentGate(then), 400); } });
      bt.style.width = "84px"; bt.style.height = "70px"; bt.style.fontSize = "30px"; row.appendChild(bt);
    });
  });
}
function openParents(focus) {
  if (running) setRunning(false);
  const sc = $("card").classList.contains("parents") && !$("modal").hidden ? $("card").scrollTop : 0;
  openModal(card => {
    card.classList.add("parents");
    h2(card, LX("Página para padres", "Parents' page", "Espace parents", "Seite für Eltern"));
    const pic = document.createElement("span"); pic.className = "picon"; pic.textContent = "👨‍👩‍👧"; pic.onclick = e => { e.stopPropagation(); secretTap(); };
    card.querySelector("h2").prepend(pic);
    const canSave = sset(KEY + "-probe", 1);
    if (!canSave) addEl(card, "div", "warn", "⚠️ En esta vista el navegador no deja guardar nada: el progreso y los ajustes se pierden al cerrar. Abre constructor.html con doble clic para que se guarden.");
    fullSection(card);
    const sec = title => { const s = addEl(card, "div", "psec"); addEl(s, "h3", "", title); return s; };

["La vía se divide en dos: recto o curva. Se coloca solo hacia el lado que encaja; tócalo con esta misma pieza para girarlo o darle la vuelta. Con ✋ cambias el camino del tren.", "The track splits in two: straight on or curve. It places itself facing the way that fits; tap it with the same piece to turn it or flip it. Use ✋ to change the train's way.", "La voie se sépare en deux : tout droit ou en courbe. Il se place tout seul du côté qui convient ; touche-le avec la même pièce pour le tourner ou le retourner. Avec ✋ tu changes le chemin du train."],
["Gira y cambia un piso: se coloca sola hacia el lado que encaja. Pon 4 seguidas (con ➕ seguir) y harás una espiral, como una montaña rusa. El botón ⇅ la cambia de subir a bajar.", "Turns and changes floor: it places itself facing the way that fits. Put 4 in a row (with ➕ continue) to make a spiral, like a roller coaster. The ⇅ button switches it between up and down.", "Tourne et change d'étage : elle se place toute seule du côté qui convient. Mets-en 4 à la suite (avec ➕ continuer) pour faire une spirale, comme des montagnes russes. Le bouton ⇅ la fait monter ou descendre."],
["Cambia un piso. Tócala junto a una vía suelta y se pone a su altura (el número rojo es el piso de esa punta): desde el suelo sube, y desde arriba baja. Si ya está puesta, sus botones: ➕ seguir (pone otra igual, ya unida), 🔄 girar y ⇅ sube/baja.", "Changes floor. Tap it next to a loose end and it sets itself at that height (the red number is that end's floor): from the ground it goes up, and from up high it comes down. Once placed, its buttons: ➕ continue (adds another one, already joined), 🔄 turn and ⇅ up/down.", "Change d'étage. Touche-la près d'un bout libre et elle se met à sa hauteur (le chiffre rouge est l'étage de ce bout) : depuis le sol elle monte, et depuis en haut elle descend. Une fois posée, ses boutons : ➕ continuer (en ajoute une autre, déjà reliée), 🔄 tourner et ⇅ monte/descend."],
["Elige la rampa.", "Pick the ramp.", "Choisis la rampe."],
["Para bajar: vuelve a ⛰️ Rampas y pon la rampa en el recuadro. Desde arriba, la rampa baja sola.", "To come down: go back to ⛰️ Ramps and put the ramp in the box. From up high, the ramp goes down by itself.", "Pour descendre : retourne dans ⛰️ Rampes et pose la rampe dans la case. Depuis en haut, la rampe descend toute seule."],
["¡Ahora una espiral! En ⛰️ Rampas elige la curva rampa.", "Now a spiral! In ⛰️ Ramps pick the ramp curve.", "Maintenant une spirale ! Dans ⛰️ Rampes choisis la courbe en rampe."],
["Botón ⚡ Sorpresas al jugar (fuego, lluvia, vacas…)", "⚡ Surprises button while playing (fire, rain, cows…)", "Bouton ⚡ Surprises en jouant (feu, pluie, vaches…)"],

["Dos trenes frente a frente: ¡empuja al otro fuera del muelle!", "Two trains nose to nose: push the other one off the pier!", "Deux trains face à face : pousse l'autre hors du quai !"],
["Aprender a jugar", "Learn to play", "Apprendre à jouer"],

["Construye lo que quieras, con todas las piezas, trenes, coches y monumentos.", "Build whatever you like, with every piece, train, car and monument.", "Construis ce que tu veux, avec toutes les pièces, trains, voitures et monuments."],

["Arrastra para mover el tablero. Toca una pieza para girarla, un desvío para cambiar su camino (flecha verde) y un tren para darle la vuelta.", "Drag to move the board. Tap a piece to turn it, a switch to change its way (green arrow) and a train to turn it around.", "Glisse pour déplacer le plateau. Touche une pièce pour la tourner, un aiguillage pour changer son chemin (flèche verte) et un train pour le faire demi-tour."],
["Toca una pieza o un tren para quitarlo. (Para cambiar una pieza no hace falta borrar: elige la nueva y tócala encima.)", "Tap a piece or a train to remove it. (To change a piece you don't need to erase: pick the new one and tap on top.)", "Touche une pièce ou un train pour l'enlever. (Pour changer une pièce, pas besoin d'effacer : choisis la nouvelle et touche dessus.)"],
["Lápiz de vías", "Track pencil", "Crayon à voies"],
["Cascada", "Waterfall", "Cascade"], ["El agua cae desde las rocas y hace espuma abajo. Pon agua 🌊 delante para que siga un río, y una vía elevada para pasar por encima.", "Water tumbles down the rocks and foams at the bottom. Put water 🌊 in front so a river carries on, and a raised track to go over it.", "L'eau tombe des rochers et fait de l'écume en bas. Mets de l'eau 🌊 devant pour qu'une rivière continue, et une voie surélevée pour passer au-dessus."], 
["¡Ya sabes lo básico! En ⚙️ tienes la ayuda y tus circuitos, y en 🏠 la biblioteca con ciudades listas para jugar. Cuando seas mayor, aprende a subir y bajar con el tutorial ⛰️.", "You know the basics! ⚙️ has the help and your layouts, and 🏠 has the library with cities ready to play. When you're older, learn to go up and down with the ⛰️ tutorial.", "Tu connais l'essentiel ! ⚙️ contient l'aide et tes circuits, et 🏠 la bibliothèque avec des villes prêtes à jouer. Quand tu seras plus grand, apprends à monter et descendre avec le tutoriel ⛰️."],
["Más", "More", "Plus"], ["Ayuda", "Help", "Aide"], ["Mis circuitos", "My layouts", "Mes circuits"], ["Sonido", "Sound", "Son"], ["Pantalla completa", "Full screen", "Plein écran"], ["Vaciar el tablero", "Clear the board", "Vider le plateau"], ["Modo constructor", "Builder mode", "Mode constructeur"], ["Herramientas avanzadas siempre a la vista (🔧 arreglar, 📐 vista de lado, pisos, mapa)", "Advanced tools always visible (🔧 fix, 📐 side view, floors, map)", "Outils avancés toujours visibles (🔧 réparer, 📐 vue de côté, étages, carte)"], ["Apagado, la pantalla es más sencilla: los pisos y la vista de lado salen solos cuando se usan rampas, y 🔧 aparece cuando un tren se puede caer.", "When off, the screen is simpler: floors and the side view appear by themselves when ramps are used, and 🔧 appears when a train could fall off.", "Désactivé, l'écran est plus simple : les étages et la vue de côté apparaissent seuls quand on utilise des rampes, et 🔧 apparaît quand un train peut tomber."], 
["Tienda", "Shop", "Boutique"], ["Trenes especiales", "Special trains", "Trains spéciaux"], ["Mejoras", "Upgrades", "Améliorations"], ["Estaciones", "Stations", "Gares"], ["Tren de oro", "Golden train", "Train en or"], ["¡Todo de oro! Brilla y va dejando estrellitas.", "All gold! It shines and leaves little stars behind.", "Tout en or ! Il brille et laisse des petites étoiles."], ["Tren arcoíris", "Rainbow train", "Train arc-en-ciel"], ["Cada vagón de un color, y deja una estela de colores.", "Every wagon a different colour, and it leaves a rainbow trail.", "Chaque wagon d'une couleur, et il laisse une traînée de couleurs."], ["Tren dragón", "Dragon train", "Train dragon"], ["Una locomotora con cara de dragón que ruge y echa fuego por la boca.", "An engine with a dragon face that roars and breathes fire.", "Une locomotive à tête de dragon qui rugit et crache du feu."], ["Tren de bomberos", "Fire train", "Train de pompiers"], ["Lleva un vagón de agua y apaga los fuegos que hay junto a la vía al pasar.", "It carries a water wagon and puts out fires next to the track as it passes.", "Il porte un wagon d'eau et éteint les feux près de la voie en passant."], ["Pintura", "Paint", "Peinture"], ["Elige el color de tus trenes en la pestaña 🚂 Trenes.", "Choose the colour of your trains in the 🚂 Trains tab.", "Choisis la couleur de tes trains dans l'onglet 🚂 Trains."], ["Trenes largos", "Long trains", "Trains longs"], ["Hasta 9 vagones en cada tren (antes 6).", "Up to 9 wagons on each train (instead of 6).", "Jusqu'à 9 wagons par train (au lieu de 6)."], ["Súper bocina", "Super horn", "Super klaxon"], ["El botón 📣 del conductor toca una fanfarria.", "The driver's 📣 button plays a fanfare.", "Le bouton 📣 du conducteur joue une fanfare."], ["Turbo rápido", "Quick turbo", "Turbo rapide"], ["El turbo 🚀 se recarga el doble de rápido.", "The 🚀 turbo recharges twice as fast.", "Le turbo 🚀 se recharge deux fois plus vite."], ["Estaciones grandes", "Big stations", "Grandes gares"], ["Caben el doble de pasajeros y de cajas esperando en cada estación.", "Twice as many passengers and boxes can wait at each station.", "Deux fois plus de voyageurs et de caisses peuvent attendre à chaque gare."], ["Café", "Café", "Café"], ["Ponlo junto a una estación (pestaña 🏙️ Ciudad): llega más gente a esa estación.", "Put it next to a station (🏙️ City tab): more people come to that station.", "Pose-le près d'une gare (onglet 🏙️ Ville) : plus de gens viennent à cette gare."], ["Monedas y tienda", "Coins and shop", "Pièces et boutique"], ["Regalar 50 monedas", "Give 50 coins", "Offrir 50 pièces"], ["Vaciar monedas y tienda", "Reset coins and shop", "Remettre à zéro pièces et boutique"], ["¿Vaciar las monedas y la tienda?", "Reset the coins and the shop?", "Remettre à zéro les pièces et la boutique ?"], ["Las monedas vuelven a 0 y lo comprado se vuelve a cerrar.", "Coins go back to 0 and everything bought is locked again.", "Les pièces reviennent à 0 et les achats sont reverrouillés."], ["Regalar monedas", "Give coins", "Offrir des pièces"], ["Cerrar", "Close", "Fermer"], 
["Noche", "Night", "Nuit"], ["Toca para que se haga de noche (y otra vez para que sea de día). Los trenes y los coches encienden los faros y las casas las luces.", "Tap to make it night (and again to make it day). Trains and cars switch on their headlights and the houses their lights.", "Touche pour qu'il fasse nuit (et encore pour qu'il fasse jour). Les trains et les voitures allument leurs phares et les maisons leurs lumières."], ["Pitar", "Toot", "Klaxonner"], ["Parar / arrancar", "Stop / go", "Arrêter / démarrer"], ["Turbo", "Turbo", "Turbo"], ["Saltar", "Jump", "Sauter"], ["Marcha atrás", "Reverse", "Marche arrière"], ["Palanca de velocidad", "Speed lever", "Levier de vitesse"], ["Dejar de conducir", "Stop driving", "Arrêter de conduire"], 
["Sorpresas", "Surprises", "Surprises"], ["Sorpresas y desastres", "Surprises and disasters", "Surprises et catastrophes"], ["Pestaña ⚡ Sorpresas (fuego, lluvia, vacas, señales…)", "⚡ Surprises tab (fire, rain, cows, signals…)", "Onglet ⚡ Surprises (feu, pluie, vaches, signaux…)"], ["Sorpresas al azar mientras juegan (vacas y rocas en la vía)", "Random surprises while they play (cows and rocks on the track)", "Surprises au hasard pendant le jeu (vaches et rochers sur la voie)"], ["Nadie se hace daño: los choques son de dibujos animados y siempre hay un rescate (bomberos, grúa…). Si a tu peque le asustan, apágalas aquí.", "Nobody gets hurt: crashes are cartoon-style and there's always a rescue (fire engine, crane…). If they scare your little one, turn them off here.", "Personne ne se fait mal : les chocs sont façon dessin animé et il y a toujours un sauvetage (pompiers, grue…). Si ça fait peur à ton petit, désactive-les ici."], ["Señal", "Signal", "Signal"], ["Ponla en una vía. Se pone roja y para al tren si otro tren está todavía en el tramo de delante (hasta la próxima señal). Así los trenes no chocan. Tócala con ✋ para ponerla roja tú.", "Put it on a track. It turns red and stops the train if another train is still in the stretch ahead (up to the next signal). That way trains don't crash. Tap it with ✋ to make it red yourself.", "Pose-le sur une voie. Il passe au rouge et arrête le train si un autre train est encore dans le tronçon devant (jusqu'au prochain signal). Comme ça les trains ne se percutent pas. Touche-le avec ✋ pour le mettre au rouge toi-même."], ["Desvío listo", "Smart switch", "Aiguillage malin"], ["Toca un desvío para hacerlo listo. Después de cada tren cambia solo, y el siguiente va por el otro lado. Si un lado tiene un tren, manda el tren por el lado libre; si los dos están ocupados, el tren espera.", "Tap a switch to make it smart. After each train it changes by itself, so the next one goes the other way. If one side has a train on it, it sends the train down the free side; if both are busy, the train waits.", "Touche un aiguillage pour le rendre malin. Après chaque train il change tout seul, et le suivant passe de l'autre côté. Si un côté a un train, il envoie le train du côté libre ; si les deux sont occupés, le train attend."], ["Barrera a mano", "Hand barrier", "Barrière à la main"], ["Toca un paso a nivel: ahora tú bajas y subes la barrera con ✋. Si viene el tren y la barrera está subida… ¡bonk! La grúa se lleva el coche.", "Tap a level crossing: now you lower and raise the barrier with ✋. If the train comes and the barrier is up… bonk! The tow truck takes the car away.", "Touche un passage à niveau : maintenant c'est toi qui baisses et lèves la barrière avec ✋. Si le train arrive et que la barrière est levée… bonk ! La dépanneuse emmène la voiture."], ["Fuego", "Fire", "Feu"], ["Toca una casa, un árbol o una estación y se prende fuego. Pulsa ▶️ y los bomberos 🚒 van por la calle a apagarlo. Sin calle, tócalo con ✋ para echar agua.", "Tap a house, a tree or a station and it catches fire. Press ▶️ and the fire engine 🚒 drives down the street to put it out. With no street, tap it with ✋ to throw water.", "Touche une maison, un arbre ou une gare et il prend feu. Appuie sur ▶️ et les pompiers 🚒 vont par la rue pour l'éteindre. Sans rue, touche-le avec ✋ pour l'arroser."], ["Vaca en la vía", "Cow on the track", "Vache sur la voie"], ["Pon una vaca en la vía. El tren frena, pita y la vaca se aparta.", "Put a cow on the track. The train brakes, toots and the cow moves away.", "Pose une vache sur la voie. Le train freine, siffle et la vache s'en va."], ["Rocas en la vía", "Rocks on the track", "Rochers sur la voie"], ["Pon rocas en la vía. El tren se para delante: tócalas y la grúa las quita.", "Put rocks on the track. The train stops in front: tap them and the crane takes them away.", "Pose des rochers sur la voie. Le train s'arrête devant : touche-les et la grue les enlève."], ["Sol", "Sun", "Soleil"], ["Hace buen tiempo. El agua de las inundaciones se va.", "Nice weather. The flood water goes away.", "Il fait beau. L'eau des inondations s'en va."], ["Lluvia", "Rain", "Pluie"], ["Llueve y los trenes van más despacio. Si llueve mucho, el río se desborda y tapa las vías de al lado: súbelas con rampas o pon el sol.", "It rains and trains go slower. If it rains a lot, the river floods the tracks next to it: lift them with ramps or bring out the sun.", "Il pleut et les trains vont moins vite. S'il pleut beaucoup, la rivière inonde les voies à côté : monte-les avec des rampes ou mets le soleil."], ["Nieve", "Snow", "Neige"], ["Nieva: los trenes van despacio y la nieve tapa la vía. Toca la nieve para quitarla.", "It snows: trains go slowly and snow covers the track. Tap the snow to clear it.", "Il neige : les trains vont lentement et la neige couvre la voie. Touche la neige pour l'enlever."], ["Viento", "Wind", "Vent"], ["Mucho viento: los árboles junto a la vía pueden caerse encima. Toca el árbol y la grúa lo quita.", "Very windy: trees next to the track can fall on it. Tap the tree and the crane takes it away.", "Beaucoup de vent : les arbres près de la voie peuvent tomber dessus. Touche l'arbre et la grue l'enlève."],  ["Lápiz de calles", "Street pencil", "Crayon à rues"],
["Arrastra el dedo y la calle se dibuja sola, con curvas y cruces. Si cruzas una vía recta, pone un paso a nivel. Si empiezas junto a una calle, se une a ella.", "Drag your finger and the street draws itself, with curves and junctions. If you cross a straight track, it adds a level crossing. If you start next to a street, it joins on.", "Glisse le doigt et la rue se dessine toute seule, avec des courbes et des carrefours. Si tu traverses une voie droite, il met un passage à niveau. Si tu commences à côté d'une rue, il s'y raccorde."],
["Arrastra el dedo por el tablero y la vía se dibuja sola, con rectas y curvas. Si empiezas junto a una vía suelta, se une a ella; si cruzas tu camino, pone un cruce. Vuelve atrás con el dedo para deshacer.", "Drag your finger across the board and the track draws itself, with straights and curves. Start next to a loose end and it joins it; cross your own path and it adds a crossing. Go back with your finger to undo.", "Glisse ton doigt sur le plateau et la voie se dessine toute seule, avec des droites et des courbes. Si tu commences près d'un bout libre, elle s'y raccorde ; si tu croises ton chemin, elle met un croisement. Reviens en arrière avec le doigt pour annuler."],
["Recta larga", "Long straight", "Grande droite"], ["Vía recta de 2 casillas.", "A straight track 2 squares long.", "Une voie droite de 2 cases."],
["Recta corta", "Short straight", "Petite droite"], ["Vía recta de 1 casilla, para rellenar huecos.", "A straight track 1 square long, for filling gaps.", "Une voie droite d'1 case, pour combler les trous."],
["Curva", "Curve", "Courbe"], ["Gira un cuarto de vuelta. Cuatro curvas hacen un círculo pequeño.", "Turns a quarter turn. Four curves make a small circle.", "Tourne d'un quart de tour. Quatre courbes font un petit cercle."],
["Curva grande", "Big curve", "Grande courbe"], ["Curva suave que ocupa 2×2 casillas. Ideal para trenes largos.", "A gentle curve that takes 2×2 squares. Great for long trains.", "Une courbe douce sur 2×2 cases. Idéale pour les longs trains."],
["Desvío a la izquierda", "Left switch", "Aiguillage à gauche"],
["La vía se divide: recto o a la izquierda. Con ✋ se cambia el camino; la flecha verde indica por dónde irá el tren.", "The track splits: straight on or left. Use ✋ to change the way; the green arrow shows where the train will go.", "La voie se sépare : tout droit ou à gauche. Avec ✋ tu changes le chemin ; la flèche verte montre où ira le train."],
["Desvío a la derecha", "Right switch", "Aiguillage à droite"],
["La vía se divide: recto o a la derecha. Con ✋ se cambia el camino; la flecha verde indica por dónde irá el tren.", "The track splits: straight on or right. Use ✋ to change the way; the green arrow shows where the train will go.", "La voie se sépare : tout droit ou à droite. Avec ✋ tu changes le chemin ; la flèche verte montre où ira le train."],
["Desvío en Y", "Y switch", "Aiguillage en Y"], ["La vía se divide en dos curvas, izquierda y derecha. Con ✋ se elige cuál.", "The track splits into two curves, left and right. Use ✋ to choose which.", "La voie se sépare en deux courbes, à gauche et à droite. Avec ✋ tu choisis laquelle."],
["Cruce", "Crossing", "Croisement"], ["Dos vías se cruzan en el mismo piso. ¡Si pasan dos trenes a la vez, chocan!", "Two tracks cross on the same floor. If two trains pass at once, they crash!", "Deux voies se croisent au même étage. Si deux trains passent en même temps, ils se percutent !"],
["Rampa", "Ramp", "Rampe"],
["Cambia un piso. Tócala junto a una vía suelta y se pone a su altura (el número rojo es el piso de esa punta). Con ⬆️ Sube va hacia arriba y con ⬇️ Baja hacia abajo. Si ya está puesta, sus botones: ➕ seguir (pone otra igual, ya unida), ↰ forma (recta o curva), 🔄 girar y ⇅ sube/baja.", "Changes one floor. Tap it next to a loose end and it goes to that height (the red number is that end's floor). With ⬆️ Up it climbs and with ⬇️ Down it goes down. Once placed, its buttons: ➕ continue (adds another, already joined), ↰ shape (straight or curve), 🔄 turn and ⇅ up/down.", "Change d'un étage. Touche-la près d'un bout libre et elle se met à sa hauteur (le chiffre rouge est l'étage de ce bout). Avec ⬆️ Monte elle monte et avec ⬇️ Descend elle descend. Une fois posée, ses boutons : ➕ suite (en ajoute une autre, déjà raccordée), ↰ forme (droite ou courbe), 🔄 tourner et ⇅ monter/descendre."],
["Curva rampa (izquierda)", "Ramp curve (left)", "Courbe en rampe (gauche)"],
["Gira a la izquierda y cambia un piso (⬆️ Sube o ⬇️ Baja). Pon 4 seguidas y harás una espiral, como una montaña rusa. El botón ⇅ le da la vuelta.", "Turns left and changes one floor (⬆️ Up or ⬇️ Down). Put 4 in a row and you get a spiral, like a roller coaster. The ⇅ button flips it.", "Tourne à gauche et change d'un étage (⬆️ Monte ou ⬇️ Descend). Mets-en 4 à la suite et tu fais une spirale, comme des montagnes russes. Le bouton ⇅ l'inverse."],
["Curva rampa (derecha)", "Ramp curve (right)", "Courbe en rampe (droite)"],
["Gira a la derecha y cambia un piso (⬆️ Sube o ⬇️ Baja). 4 seguidas hacen una espiral. El botón ⇅ le da la vuelta.", "Turns right and changes one floor (⬆️ Up or ⬇️ Down). 4 in a row make a spiral. The ⇅ button flips it.", "Tourne à droite et change d'un étage (⬆️ Monte ou ⬇️ Descend). 4 à la suite font une spirale. Le bouton ⇅ l'inverse."],
["Estación", "Station", "Gare"], ["El tren se para un momento y suena la campana.", "The train stops for a moment and the bell rings.", "Le train s'arrête un instant et la cloche sonne."],
["Túnel", "Tunnel", "Tunnel"], ["El tren pasa por dentro de una montaña y desaparece un momento.", "The train goes inside a mountain and disappears for a moment.", "Le train passe dans une montagne et disparaît un instant."],
["Túnel largo", "Long tunnel", "Long tunnel"], ["Túnel de 2 casillas.", "A tunnel 2 squares long.", "Un tunnel de 2 cases."],
["Tope", "Buffer stop", "Butoir"], ["Final de vía: el tren se para y vuelve marcha atrás.", "End of the line: the train stops and goes back in reverse.", "Fin de voie : le train s'arrête et repart en marche arrière."],
["Paso a nivel", "Level crossing", "Passage à niveau"],
["Una calle cruza la vía. Las barreras bajan cuando llega un tren y los coches esperan. Únelo a las calles de la pestaña 🚗.", "A street crosses the track. The barriers come down when a train comes and the cars wait. Join it to the streets from the 🚗 tab.", "Une rue traverse la voie. Les barrières baissent quand un train arrive et les voitures attendent. Relie-le aux rues de l'onglet 🚗."],
["Calle recta", "Straight street", "Rue droite"], ["Calle para coches. Dibuja calles y únelas a un paso a nivel para que los coches crucen la vía.", "A street for cars. Draw streets and join them to a level crossing so cars can cross the track.", "Une rue pour les voitures. Dessine des rues et relie-les à un passage à niveau pour que les voitures traversent la voie."],
["Calle en curva", "Curved street", "Rue en courbe"], ["La calle gira un cuarto de vuelta.", "The street turns a quarter turn.", "La rue tourne d'un quart de tour."],
["Cruce en T", "T junction", "Carrefour en T"], ["Tres calles se juntan. Los coches eligen solos hacia dónde ir.", "Three streets meet. The cars choose where to go by themselves.", "Trois rues se rejoignent. Les voitures choisissent toutes seules où aller."],
["Cruce de calles", "Crossroads", "Carrefour"], ["Cuatro calles se juntan, con pasos de cebra. Los coches eligen camino al azar.", "Four streets meet, with zebra crossings. The cars pick a way at random.", "Quatre rues se rejoignent, avec des passages piétons. Les voitures choisissent un chemin au hasard."],
["Calle con vías de tranvía", "Street with tram tracks", "Rue avec rails de tram"], ["Una calle por la que van a la vez los coches y el tranvía. El tranvía espera si un coche va delante. Ponla encima de una calle para cambiarla.", "A street shared by cars and the tram. The tram waits if a car is in front. Put it on top of a street to change it.", "Une rue partagée par les voitures et le tram. Le tram attend si une voiture est devant. Pose-la sur une rue pour la changer."],
["Curva de calle con vías", "Curved street with tracks", "Courbe de rue avec rails"], ["La calle con vías de tranvía gira un cuarto de vuelta.", "The street with tram tracks turns a quarter turn.", "La rue avec rails de tram tourne d'un quart de tour."],
["Trenes", "Trains", "Trains"],
["Elige un tren y toca una vía para ponerlo. Toca el tren para cambiar su dirección. Con ➖ ➕ eliges cuántos vagones lleva.", "Pick a train and tap a track to place it. Tap the train to change its direction. Use ➖ ➕ to choose how many cars it pulls.", "Choisis un train et touche une voie pour le poser. Touche le train pour changer sa direction. Avec ➖ ➕ tu choisis combien de wagons il tire."],
["Toca una vía para ponerlo y tócalo para darle la vuelta. ➖ ➕ cambian los vagones.", "Tap a track to place it and tap it to turn it around. ➖ ➕ change the cars.", "Touche une voie pour le poser et touche-le pour le faire demi-tour. ➖ ➕ changent les wagons."],
["Toca una calle para ponerlo. Anda cuando pulsas ▶️, elige camino en los cruces y espera en el paso a nivel. Tócalo para darle la vuelta.", "Tap a street to place it. It drives when you press ▶️, chooses its way at junctions and waits at level crossings. Tap it to turn it around.", "Touche une rue pour la poser. Elle roule quand tu appuies sur ▶️, choisit son chemin aux carrefours et attend au passage à niveau. Touche-la pour la faire demi-tour."],
["Figura de adorno. Aquí no hay vía: si un tren llega, ¡descarrila!", "A decoration. There is no track here: if a train gets here, it derails!", "Une décoration. Il n'y a pas de voie ici : si un train arrive, il déraille !"],
["Un río, un lago o el mar. Pasa por encima con una vía elevada (sube con una rampa).", "A river, a lake or the sea. Cross it with a raised track (go up with a ramp).", "Une rivière, un lac ou la mer. Passe au-dessus avec une voie surélevée (monte avec une rampe)."],
["Agua (río o mar)", "Water (river or sea)", "Eau (rivière ou mer)"],

["Arco del Triunfo (París)", "Arc de Triomphe (Paris)", "Arc de Triomphe (Paris)"], ["Ocupa 3 casillas. Una vía (o una calle) puede pasar por debajo del arco central.", "Takes 3 squares. A track (or a street) can pass under the middle arch.", "Occupe 3 cases. Une voie (ou une rue) peut passer sous l'arche du milieu."],
["Torre Eiffel (París)", "Eiffel Tower (Paris)", "Tour Eiffel (Paris)"], ["Ocupa 3×3 casillas y es altísima. Las vías pasan entre sus patas, por la fila o la columna del medio.", "Takes 3×3 squares and is very tall. Tracks pass between its legs, along the middle row or column.", "Occupe 3×3 cases et elle est très haute. Les voies passent entre ses pieds, par la rangée ou la colonne du milieu."],
["Tower Bridge (Londres)", "Tower Bridge (London)", "Tower Bridge (Londres)"], ["Ocupa 5 casillas. Entre las dos torres caben 3 vías por debajo de las pasarelas.", "Takes 5 squares. Between the two towers, 3 tracks fit under the walkways.", "Occupe 5 cases. Entre les deux tours, 3 voies passent sous les passerelles."],
["Acueducto de Segovia", "Segovia Aqueduct", "Aqueduc de Ségovie"], ["6 arcos de piedra de 2 pisos: puede pasar una vía o una calle bajo cada arco.", "6 two-storey stone arches: a track or a street can pass under each arch.", "6 arches de pierre sur 2 étages : une voie ou une rue peut passer sous chaque arche."],
["Puerta de Alcalá (Madrid)", "Puerta de Alcalá (Madrid)", "Porte d'Alcalá (Madrid)"], ["Ocupa 5 casillas. Las vías pasan por los tres arcos del centro.", "Takes 5 squares. Tracks pass through the three middle arches.", "Occupe 5 cases. Les voies passent par les trois arches du milieu."],
["Torii gigante (Japón)", "Giant torii (Japan)", "Torii géant (Japon)"], ["Gran puerta roja de 3 casillas. Una vía pasa por el centro.", "A big red gate 3 squares wide. A track passes through the middle.", "Une grande porte rouge de 3 cases. Une voie passe au milieu."],
["Obelisco (Buenos Aires)", "Obelisk (Buenos Aires)", "Obélisque (Buenos Aires)"], ["Alto y blanco, en el centro de la avenida 9 de Julio. Ocupa 1 casilla.", "Tall and white, in the middle of 9 de Julio Avenue. Takes 1 square.", "Haut et blanc, au milieu de l'avenue 9 de Julio. Occupe 1 case."],
["Big Ben (Londres)", "Big Ben (London)", "Big Ben (Londres)"], ["La torre del reloj más famosa. Ocupa 1 casilla.", "The most famous clock tower. Takes 1 square.", "La tour de l'horloge la plus célèbre. Occupe 1 case."],
["Faro", "Lighthouse", "Phare"], ["Faro de rayas rojas y blancas para la costa. Ocupa 1 casilla.", "A red and white striped lighthouse for the coast. Takes 1 square.", "Un phare rayé rouge et blanc pour la côte. Occupe 1 case."],
["Monte con túnel", "Hill with tunnel", "Colline avec tunnel"], ["Una colina de 3 casillas con un túnel por dentro: la vía pasa por debajo, en el piso 0.", "A 3-square hill with a tunnel inside: the track goes under it, on floor 0.", "Une colline de 3 cases avec un tunnel dedans : la voie passe dessous, à l'étage 0."],
["Plaza", "Square", "Place"], ["Plaza (adoquines)", "Square (cobbles)", "Place (pavés)"], ["Suelo de adoquines. Arrastra el dedo para pintar muchas casillas. Encima se puede poner de todo.", "Cobbled ground. Drag your finger to paint lots of squares. You can put anything on top.", "Sol pavé. Glisse le doigt pour peindre beaucoup de cases. On peut tout mettre dessus."],
["Arena", "Sand", "Sable"], ["Arena de playa", "Beach sand", "Sable de plage"], ["Suelo de playa. Arrastra para pintar.", "Beach ground. Drag to paint.", "Sol de plage. Glisse pour peindre."],
["Parque", "Park", "Parc"], ["Parque con flores", "Park with flowers", "Parc fleuri"], ["Césped con flores. Arrastra para pintar.", "Grass with flowers. Drag to paint.", "Gazon fleuri. Glisse pour peindre."],
["Nieve o sal", "Snow or salt", "Neige ou sel"], ["Suelo blanco para montañas nevadas o salares. Arrastra para pintar.", "White ground for snowy mountains or salt flats. Drag to paint.", "Sol blanc pour les montagnes enneigées ou les salars. Glisse pour peindre."],
["Campo de cultivo", "Farm field", "Champ cultivé"], ["Campo de cultivo con surcos. Arrastra para pintar.", "A farm field with furrows. Drag to paint.", "Un champ avec des sillons. Glisse pour peindre."],

["Tren de pasajeros", "Passenger train", "Train de voyageurs"], ["Rápido. Motor diésel con un poco de humo gris y bocina de dos notas.", "Fast. Diesel engine with a little grey smoke and a two-note horn.", "Rapide. Moteur diesel avec un peu de fumée grise et un klaxon à deux notes."],
["Tren de mercancías", "Freight train", "Train de marchandises"], ["Lento y pesado. Humo oscuro, vagones que hacen «taca-taca» y bocina grave.", "Slow and heavy. Dark smoke, wagons that go “clickety-clack” and a deep horn.", "Lent et lourd. Fumée sombre, wagons qui font « tac-tac » et klaxon grave."],
["Tren bala", "Bullet train", "Train à grande vitesse"], ["¡El más rápido! Sin humo: deja estelas de viento, hace «fiuuu» y toca una melodía.", "The fastest! No smoke: it leaves wind trails, goes “whoosh” and plays a tune.", "Le plus rapide ! Pas de fumée : il laisse des traînées de vent, fait « fiouuu » et joue une mélodie."],
["Metro (subte)", "Subway", "Métro"], ["Rápido y eléctrico, perfecto para ir bajo tierra (piso −1). Hace un zumbido suave.", "Fast and electric, perfect for going underground (floor −1). It hums softly.", "Rapide et électrique, parfait pour rouler sous terre (étage −1). Il bourdonne doucement."],
["Tranvía", "Tram", "Tram"], ["El más lento. Saca chispas eléctricas del techo y hace «ding-ding».", "The slowest. Electric sparks fly from its roof and it goes “ding-ding”.", "Le plus lent. Des étincelles sortent de son toit et il fait « ding-ding »."],

["En marcha", "Running", "En marche"],
["Ahora solo puedes cambiar los desvíos con ✋ y tocar trenes y coches para que piten. Pulsa ⏸️ para seguir construyendo.", "Now you can only change switches with ✋ and tap trains and cars to make them hoot. Press ⏸️ to keep building.", "Maintenant tu peux seulement changer les aiguillages avec ✋ et toucher les trains et les voitures pour qu'ils klaxonnent. Appuie sur ⏸️ pour continuer à construire."],

// side view
["📐 Vista de lado", "📐 Side view", "📐 Vue de côté"],
["Toca una vía con ✋ para ver su fila de frente.", "Tap a track with ✋ to see its row from the front.", "Touche une voie avec ✋ pour voir sa rangée de face."],
["Así se ve de frente la franja amarilla del tablero. Los números son los pisos. La 🚂 es el tamaño del tren.", "This is the yellow strip of the board seen from the front. The numbers are the floors. The 🚂 shows the train's size.", "Voici la bande jaune du plateau vue de face. Les chiffres sont les étages. Le 🚂 montre la taille du train."],

["💾 Proyectos y guardados", "💾 Projects and saves", "💾 Projets et sauvegardes"], ["⭐ Proyectos listos para jugar", "⭐ Ready-to-play projects", "⭐ Projets prêts à jouer"],
["Toca uno para cargarlo y pulsa ▶️. Todos traen trenes preparados.", "Tap one to load it and press ▶️. They all come with trains ready.", "Touche-en un pour le charger et appuie sur ▶️. Ils ont tous des trains prêts."],
["📁 Mis circuitos", "📁 My layouts", "📁 Mes circuits"],
["⚠️ Aquí no se puede guardar: esta vista no deja usar el almacenamiento del navegador. Abre constructor.html con doble clic para poder guardar.", "⚠️ Saving isn't possible here: this view can't use the browser's storage. Open the game directly in your browser to save.", "⚠️ Impossible de sauvegarder ici : cette vue ne peut pas utiliser le stockage du navigateur. Ouvre le jeu directement dans ton navigateur pour sauvegarder."],
["Nombre del circuito", "Layout name", "Nom du circuit"], ["Guardar con este nombre", "Save with this name", "Sauvegarder sous ce nom"],
["Escribe un nombre y pulsa 💾. Si el nombre ya existe, se sustituye.", "Type a name and press 💾. If the name already exists, it is replaced.", "Écris un nom et appuie sur 💾. Si le nom existe déjà, il est remplacé."],
["Todavía no hay circuitos guardados.", "No saved layouts yet.", "Pas encore de circuits sauvegardés."], ["Borrar (toca dos veces)", "Delete (tap twice)", "Supprimer (touche deux fois)"],
["Mi circuito", "My layout", "Mon circuit"],
["🗑️ ¿Vaciar el tablero?", "🗑️ Clear the board?", "🗑️ Vider le plateau ?"], ["Se quitan todas las piezas y los trenes. Los circuitos guardados no se borran.", "All pieces and trains are removed. Saved layouts are kept.", "Toutes les pièces et tous les trains sont enlevés. Les circuits sauvegardés sont gardés."],
["Sí, vaciar", "Yes, clear it", "Oui, vider"],
// help
["❓ Cómo se juega", "❓ How to play", "❓ Comment jouer"], ["🎓 Empezar el tutorial paso a paso", "🎓 Start the step-by-step tutorial", "🎓 Commencer le tutoriel pas à pas"],
["Abajo hay pestañas: 🛤️ Vías, 🔀 Desvíos, ⛰️ Subir, 🚉 Especiales, 🌳 Campo, 🏙️ Ciudad, 🗼 Monumentos y 🚂 Trenes. Elige una pieza: encima verás su nombre y para qué sirve.", "At the bottom there are tabs: 🛤️ Track, 🔀 Switches, ⛰️ Ramps, 🚉 Special, 🌳 Country, 🏙️ City, 🗼 Monuments and 🚂 Trains. Pick a piece: above it you'll see its name and what it does.", "En bas il y a des onglets : 🛤️ Voies, 🔀 Aiguillages, ⛰️ Rampes, 🚉 Spéciales, 🌳 Campagne, 🏙️ Ville, 🗼 Monuments et 🚂 Trains. Choisis une pièce : au-dessus tu verras son nom et à quoi elle sert."],
["Toca el tablero para ponerla. Se gira sola para encajar con la vía de al lado. Toca encima con la misma pieza para girarla, o con otra pieza para cambiarla (no hace falta borrar).", "Tap the board to place it. It turns by itself to fit the track next to it. Tap on it with the same piece to turn it, or with another piece to swap it (no need to erase).", "Touche le plateau pour la poser. Elle tourne toute seule pour s'emboîter avec la voie voisine. Touche-la avec la même pièce pour la tourner, ou avec une autre pièce pour la remplacer (pas besoin d'effacer)."],
["El lápiz (pestaña 🛤️ Vías) dibuja la vía arrastrando el dedo: pone las rectas y las curvas solo.", "The pencil (🛤️ Track tab) draws track as you drag your finger: it adds the straights and curves for you.", "Le crayon (onglet 🛤️ Voies) dessine la voie quand tu glisses le doigt : il met tout seul les droites et les courbes."],
["Los puntos rojos que parpadean son vías sueltas: ¡ciérralas o el tren descarrilará!", "The blinking red dots are loose ends: close them or the train will derail!", "Les points rouges qui clignotent sont des bouts libres : ferme-les ou le train déraillera !"],
["Pestaña 🚂: elige un tren y los vagones (➖ ➕) y toca una vía. La flecha verde indica hacia dónde irá; toca el tren para darle la vuelta.", "🚂 tab: pick a train and its cars (➖ ➕) and tap a track. The green arrow shows where it will go; tap the train to turn it around.", "Onglet 🚂 : choisis un train et ses wagons (➖ ➕) et touche une voie. La flèche verte montre où il ira ; touche le train pour le faire demi-tour."],
["Pulsa ▶️ para arrancar. 🐢—🐇 cambia la velocidad. 🔄 vuelve a poner los trenes en su sitio.", "Press ▶️ to start. 🐢—🐇 changes the speed. 🔄 puts the trains back where they started.", "Appuie sur ▶️ pour démarrer. 🐢—🐇 change la vitesse. 🔄 remet les trains à leur place."],
["Con ✋ cambias los desvíos (también con los trenes en marcha) y mueves el tablero. Dos dedos, la rueda o ➕ ➖ para acercar y alejar.", "With ✋ you change switches (even while trains are running) and move the board. Two fingers, the wheel or ➕ ➖ to zoom in and out.", "Avec ✋ tu changes les aiguillages (même quand les trains roulent) et tu déplaces le plateau. Deux doigts, la molette ou ➕ ➖ pour zoomer."],
["Pisos: a la derecha, ⬆️ ⬇️ eligen el piso donde construyes. Bajo el suelo hay dos pisos de metro (−1 y −2): baja con una rampa ⬇️ Baja para hacer un subte. En la pestaña ⛰️ Rampas eliges ⬆️ Sube o ⬇️ Baja, y el piso de construcción sigue a la rampa solo. Si una rampa ya puesta va al revés, toca el botón amarillo ⇅ que sale encima. Mientras construyes, los pisos de arriba se ven transparentes.", "Floors: on the right, ⬆️ ⬇️ choose the floor you build on. Below ground there are two subway floors (−1 and −2): go down with a ⬇️ Down ramp to make a subway. In the ⛰️ Ramps tab you choose ⬆️ Up or ⬇️ Down, and the building floor follows the ramp by itself. If a placed ramp goes the wrong way, tap the yellow ⇅ button above it. While you build, the floors above look see-through.", "Étages : à droite, ⬆️ ⬇️ choisissent l'étage où tu construis. Sous le sol il y a deux étages de métro (−1 et −2) : descends avec une rampe ⬇️ Descend pour faire un métro. Dans l'onglet ⛰️ Rampes tu choisis ⬆️ Monte ou ⬇️ Descend, et l'étage de construction suit la rampe tout seul. Si une rampe posée va dans le mauvais sens, touche le bouton jaune ⇅ au-dessus. Pendant que tu construis, les étages du dessus sont transparents."],
["Espiral: pon 4 «curvas rampa» seguidas y el tren subirá dando una vuelta. Para bajar, otra espiral recorrida al revés. Mira el proyecto 🎢 Montaña rusa.", "Spiral: put 4 “ramp curves” in a row and the train will climb going round. To come down, another spiral the other way. Look at the 🎢 Roller coaster project.", "Spirale : mets 4 « courbes en rampe » à la suite et le train montera en tournant. Pour descendre, une autre spirale dans l'autre sens. Regarde le projet 🎢 Montagnes russes."],
["Mientras el juego está en marcha (▶️) no se puede construir: solo cambiar desvíos con ✋ y tocar trenes y coches para que piten. Pulsa ⏸️ para construir.", "While the game is running (▶️) you can't build: only change switches with ✋ and tap trains and cars to make them hoot. Press ⏸️ to build.", "Quand le jeu tourne (▶️) on ne peut pas construire : seulement changer les aiguillages avec ✋ et toucher les trains et les voitures pour qu'ils klaxonnent. Appuie sur ⏸️ pour construire."],
["Pestaña 🚗 Calles: dibuja calles, cruces y pasos a nivel y pon coches, taxis, autobuses… Andan solos, eligen camino en los cruces y esperan cuando bajan las barreras.", "🚗 Streets tab: draw streets, junctions and level crossings and add cars, taxis, buses… They drive by themselves, choose their way at junctions and wait when the barriers come down.", "Onglet 🚗 Rues : dessine des rues, des carrefours et des passages à niveau et ajoute des voitures, des taxis, des bus… Ils roulent tout seuls, choisissent leur chemin aux carrefours et attendent quand les barrières baissent."],
["Pestaña 🏛️ Monumentos: monumentos grandes en 3D. Las vías pueden pasar por debajo de sus arcos (por ejemplo, entre las patas de la Torre Eiffel).", "🏛️ Monuments tab: big 3D monuments. Tracks can pass under their arches (for example between the legs of the Eiffel Tower).", "Onglet 🏛️ Monuments : de grands monuments en 3D. Les voies peuvent passer sous leurs arches (par exemple entre les pieds de la tour Eiffel)."],
["Cada tren es distinto: el bala es el más rápido y no echa humo, el de vapor hace chu-chu con humo blanco, el de mercancías es lento y pesado, el tranvía saca chispas.", "Every train is different: the bullet train is the fastest and has no smoke, the steam engine goes choo-choo with white smoke, the freight train is slow and heavy, the tram makes sparks.", "Chaque train est différent : le TGV est le plus rapide et ne fume pas, la locomotive à vapeur fait tchou-tchou avec de la fumée blanche, le train de marchandises est lent et lourd, le tram fait des étincelles."],
["El botón 🔧 busca las vías sueltas, donde el tren se caería, y te propone cómo arreglarlas: cambia una pieza mal puesta, añade vía (también rampas y espirales) y, si hace falta, quita alguna pieza para rehacer la unión. Si no quieres quitar piezas, elige 🛑 Solo topes. Acepta con ✔️ o quítalo con ✖️.", "The 🔧 button finds loose ends, where the train would fall off, and suggests how to fix them: it changes a badly placed piece, adds track (ramps and spirals too) and, if needed, removes a few pieces to redo the join. If you don't want pieces removed, choose 🛑 Only buffer stops. Accept with ✔️ or remove it with ✖️.", "Le bouton 🔧 cherche les bouts libres, où le train tomberait, et te propose comment les réparer : il change une pièce mal posée, ajoute de la voie (rampes et spirales aussi) et, si besoin, enlève quelques pièces pour refaire le raccord. Si tu ne veux pas enlever de pièces, choisis 🛑 Seulement des butoirs. Accepte avec ✔️ ou enlève avec ✖️."],
["Si dos trenes se tocan en el mismo piso, chocan. Si un tren llega a una vía suelta o al borde, descarrila: toca 🔄 para recolocarlo.", "If two trains touch on the same floor, they crash. If a train reaches a loose end or the edge, it derails: tap 🔄 to put it back.", "Si deux trains se touchent au même étage, ils se percutent. Si un train arrive à un bout libre ou au bord, il déraille : touche 🔄 pour le remettre."],
["En 💾 hay proyectos de ciudades listos para jugar y puedes guardar tus circuitos con nombre.", "In 💾 there are ready-to-play city projects and you can save your layouts with a name.", "Dans 💾 il y a des projets de villes prêts à jouer et tu peux sauvegarder tes circuits avec un nom."],
// tutorial
["👋 ¡Bienvenido!", "👋 Welcome!", "👋 Bienvenue !"],
["¿Quieres aprender a jugar paso a paso? El tutorial te enseña a construir un circuito, poner un tren y arrancarlo (tarda unos 3 minutos).", "Would you like to learn to play step by step? The tutorial shows you how to build a layout, add a train and start it (about 3 minutes).", "Tu veux apprendre à jouer pas à pas ? Le tutoriel t'apprend à construire un circuit, poser un train et le démarrer (environ 3 minutes)."],
["🎓 Sí, ¡enséñame!", "🎓 Yes, show me!", "🎓 Oui, montre-moi !"], ["Ahora no", "Not now", "Pas maintenant"], ["Empezar el tutorial", "Start the tutorial", "Commencer le tutoriel"],
["¡Hola! Vamos a construir juntos un circuito de tren. Sigue las luces amarillas: te dicen qué tocar.", "Hi! Let's build a train layout together. Follow the yellow lights: they tell you what to tap.", "Salut ! Construisons ensemble un circuit de train. Suis les lumières jaunes : elles te montrent quoi toucher."],
["¡Empezamos!", "Let's go!", "C'est parti !"],
["Abajo están las pestañas con las piezas. Toca la pestaña 🛤️ Vías.", "The tabs with the pieces are at the bottom. Tap the 🛤️ Track tab.", "Les onglets avec les pièces sont en bas. Touche l'onglet 🛤️ Voies."],
["Elige la curva.", "Pick the curve.", "Choisis la courbe."],
["Toca los 4 recuadros amarillos del tablero para poner las 4 curvas.", "Tap the 4 yellow boxes on the board to place the 4 curves.", "Touche les 4 cases jaunes du plateau pour poser les 4 courbes."],
["¡Muy bien! Ahora elige la recta corta.", "Well done! Now pick the short straight.", "Très bien ! Maintenant choisis la petite droite."],
["Pon rectas en los huecos amarillos. Los puntos rojos que parpadean son vías sueltas: cuando desaparecen, ¡el circuito está cerrado!", "Put straights in the yellow gaps. The blinking red dots are loose ends: when they disappear, the layout is closed!", "Mets des droites dans les trous jaunes. Les points rouges qui clignotent sont des bouts libres : quand ils disparaissent, le circuit est fermé !"],
["Si te equivocas de pieza, no hace falta borrar: elige otra y tócala encima. Prueba: abre 🚉 Estación, elige la estación y toca las rectas de arriba.", "If you pick the wrong piece, no need to erase: choose another and tap on top. Try it: open 🚉 Station, pick the station and tap the straights at the top.", "Si tu te trompes de pièce, pas besoin d'effacer : choisis-en une autre et touche dessus. Essaie : ouvre 🚉 Gare, choisis la gare et touche les droites du haut."],
["¡Ahora un tren! Abre la pestaña 🚂 Trenes, elige el que más te guste y toca la vía.", "Now a train! Open the 🚂 Trains tab, pick the one you like best and tap the track.", "Maintenant un train ! Ouvre l'onglet 🚂 Trains, choisis celui que tu préfères et touche la voie."],
["La flecha verde dice hacia dónde irá (toca el tren para darle la vuelta). Pulsa ▶️ para arrancar.", "The green arrow shows where it will go (tap the train to turn it around). Press ▶️ to start.", "La flèche verte montre où il ira (touche le train pour le faire demi-tour). Appuie sur ▶️ pour démarrer."],
["¡Chu-chu! Mientras el tren anda no se puede construir: solo cambiar desvíos. Cuando quieras, pulsa ⏸️ para parar.", "Choo-choo! While the train runs you can't build: only change switches. Whenever you like, press ⏸️ to stop.", "Tchou-tchou ! Quand le train roule on ne peut pas construire : seulement changer les aiguillages. Quand tu veux, appuie sur ⏸️ pour arrêter."],
["Truco: con el lápiz ✏️ dibujas la vía arrastrando el dedo, y las curvas se ponen solas. Elige el lápiz y dibuja un camino que salga de la estación.", "Tip: with the pencil ✏️ you draw track by dragging your finger, and the curves go in by themselves. Pick the pencil and draw a path leaving the station.", "Astuce : avec le crayon ✏️ tu dessines la voie en glissant le doigt, et les courbes se mettent toutes seules. Choisis le crayon et dessine un chemin qui part de la gare."],
["¡Ahora a subir y bajar! Abre la pestaña ⛰️ Rampas.", "Now let's go up and down! Open the ⛰️ Ramps tab.", "Maintenant on monte et on descend ! Ouvre l'onglet ⛰️ Rampes."],
["Pulsa ⬆️ Sube y elige la rampa.", "Press ⬆️ Up and pick the ramp.", "Appuie sur ⬆️ Monte et choisis la rampe."],
["Pon la rampa en el recuadro amarillo, junto a la punta suelta. Fíjate: el número rojo dice en qué piso está cada punta.", "Put the ramp in the yellow box, next to the loose end. Look: the red number tells you which floor each end is on.", "Pose la rampe dans la case jaune, près du bout libre. Regarde : le chiffre rouge dit à quel étage est chaque bout."],
["¡Has subido al piso 1! Abre 🛤️ Vías y pon una recta corta en el recuadro de arriba. Toca justo al lado de la punta: la pieza se pone sola a su altura.", "You've gone up to floor 1! Open 🛤️ Track and put a short straight in the box above. Tap right next to the end: the piece goes to its height by itself.", "Tu es monté à l'étage 1 ! Ouvre 🛤️ Voies et pose une petite droite dans la case du haut. Touche juste à côté du bout : la pièce se met toute seule à sa hauteur."],
["Para bajar: vuelve a ⛰️ Rampas, pulsa ⬇️ Baja y pon la rampa en el recuadro.", "To come down: go back to ⛰️ Ramps, press ⬇️ Down and put the ramp in the box.", "Pour descendre : retourne dans ⛰️ Rampes, appuie sur ⬇️ Descend et pose la rampe dans la case."],
["Toca 📐 para verlo de lado: la vía sube al piso 1 y vuelve a bajar. Truco: al tocar una rampa, ➕ seguir pone la siguiente ya unida y ↰ forma la cambia de recta a curva.", "Tap 📐 to see it from the side: the track climbs to floor 1 and comes back down. Tip: when you tap a ramp, ➕ continue adds the next one already joined and ↰ shape changes it from straight to curve.", "Touche 📐 pour le voir de côté : la voie monte à l'étage 1 et redescend. Astuce : quand tu touches une rampe, ➕ suite ajoute la suivante déjà raccordée et ↰ forme la change de droite en courbe."],
["¡Ya sabes lo básico! ⬆️ ⬇️ cambian de piso para hacer puentes y espirales, ❓ tiene la ayuda y en 💾 hay ciudades listas para jugar.", "Now you know the basics! ⬆️ ⬇️ change floors to make bridges and spirals, ❓ has the help and 💾 has cities ready to play.", "Tu connais les bases ! ⬆️ ⬇️ changent d'étage pour faire des ponts et des spirales, ❓ contient l'aide et dans 💾 il y a des villes prêtes à jouer."],

["La primera vía", "The first track", "La première voie"], ["La curva", "The curve", "La courbe"], ["El bosque", "The forest", "La forêt"], ["El desvío", "The switch", "L'aiguillage"], ["Las vacas", "The cows", "Les vaches"],
["Lleva el tren desde la estación A hasta la 🏁. Pon rectas en el hueco y pulsa ▶️.", "Take the train from station A to the 🏁. Put straights in the gap and press ▶️.", "Amène le train de la gare A jusqu'au 🏁. Mets des droites dans le trou et appuie sur ▶️."],
["La 🏁 está arriba. Usa curvas para girar.", "The 🏁 is up there. Use curves to turn.", "Le 🏁 est en haut. Utilise des courbes pour tourner."],
["Un bosque tapa el camino. Rodéalo por arriba o por abajo. ¡Recoge la 🪙!", "A forest blocks the way. Go round it above or below. Pick up the 🪙!", "Une forêt bloque le chemin. Contourne-la par le haut ou par le bas. Ramasse la 🪙 !"],
["Cierra el hueco de arriba. Primero deja el desvío recto: el tren irá hasta el tope, cogerá la 🪙 y volverá. Entonces toca el desvío con ✋ para que vaya a la 🏁.", "Close the gap at the top. First leave the switch straight: the train will go to the buffer stop, pick up the 🪙 and come back. Then tap the switch with ✋ so it goes to the 🏁.", "Ferme le trou du haut. D'abord laisse l'aiguillage tout droit : le train ira jusqu'au butoir, prendra la 🪙 et reviendra. Ensuite touche l'aiguillage avec ✋ pour qu'il aille au 🏁."],
["Las vacas cruzan la vía. El tren frena para no atropellarlas: ¡ten paciencia y espera a que pasen!", "The cows cross the track. The train brakes so it doesn't hit them: be patient and wait for them to pass!", "Les vaches traversent la voie. Le train freine pour ne pas les renverser : sois patient et attends qu'elles passent !"],
["Para llegar a la 🏁 hay que pasar por debajo de uno de los arcos de la Puerta de Alcalá.", "To reach the 🏁 you have to go under one of the arches of the Puerta de Alcalá.", "Pour arriver au 🏁 il faut passer sous l'une des arches de la Porte d'Alcalá."],
["El acueducto romano tiene muchos arcos. Haz que la vía pase por debajo de uno.", "The Roman aqueduct has lots of arches. Make the track go under one of them.", "L'aqueduc romain a beaucoup d'arches. Fais passer la voie sous l'une d'elles."],
["El río Guadalquivir corta el camino. Sube con una rampa (⬆️ Sube), cruza por el piso 1 y baja con otra rampa (⬇️ Baja).", "The Guadalquivir river blocks the way. Go up with a ramp (⬆️ Up), cross on floor 1 and come down with another ramp (⬇️ Down).", "Le fleuve Guadalquivir coupe le chemin. Monte avec une rampe (⬆️ Monte), traverse à l'étage 1 et redescends avec une autre rampe (⬇️ Descend)."],
["¡Cuidado! Un tren de mercancías da vueltas sin parar y cruza tu camino dos veces. Construye la vía y pulsa ▶️ en el momento justo para no chocar.", "Careful! A freight train goes round and round and crosses your path twice. Build the track and press ▶️ at just the right moment so you don't crash.", "Attention ! Un train de marchandises tourne sans arrêt et croise ton chemin deux fois. Construis la voie et appuie sur ▶️ au bon moment pour ne pas le percuter."],
["Una calle con coches corta el camino. Pon un paso a nivel encima de la calle: ¡las barreras pararán a los coches!", "A street with cars blocks the way. Put a level crossing on the street: the barriers will stop the cars!", "Une rue avec des voitures coupe le chemin. Pose un passage à niveau sur la rue : les barrières arrêteront les voitures !"],
["¡La Torre Eiffel! La vía puede pasar por debajo, entre sus patas.", "The Eiffel Tower! The track can go underneath, between its legs.", "La tour Eiffel ! La voie peut passer dessous, entre ses pieds."],
["Cruza el río Támesis por el piso 1, entre las torres del Tower Bridge.", "Cross the River Thames on floor 1, between the towers of Tower Bridge.", "Traverse la Tamise à l'étage 1, entre les tours du Tower Bridge."],
["¡Dos trenes! Lleva cada uno a su 🏁 sin que choquen. Truco: haz que uno pase por encima del otro.", "Two trains! Take each one to its 🏁 without crashing. Tip: make one pass over the other.", "Deux trains ! Amène chacun à son 🏁 sans qu'ils se percutent. Astuce : fais passer l'un au-dessus de l'autre."],
["La 🏁 está en lo alto de la montaña, en el piso 2. ¡Sube con rampas o con una espiral!", "The 🏁 is at the top of the mountain, on floor 2. Climb with ramps or a spiral!", "Le 🏁 est en haut de la montagne, à l'étage 2. Monte avec des rampes ou une spirale !"],
["Arriba hay una ciudad llena de edificios y coches. ¡Pasa por debajo con el subte! Pon una rampa con ⬇️ Baja para entrar bajo tierra (piso menos uno), cruza bajo la calle y sube con otra rampa ⬆️ Sube.", "Up here there's a city full of buildings and cars. Go underneath with the subway! Put a ramp with ⬇️ Down to go underground (floor minus one), cross under the street and come up with another ⬆️ Up ramp.", "En haut il y a une ville pleine d'immeubles et de voitures. Passe dessous avec le métro ! Pose une rampe avec ⬇️ Descend pour aller sous terre (étage moins un), traverse sous la rue et remonte avec une autre rampe ⬆️ Monte."],
["Tu tranvía tiene que ir por la rambla, junto a los coches. Cambia la calle por la calle con vías 🚋: tócala encima. El tranvía espera si un coche va delante.", "Your tram has to run along the seafront, next to the cars. Swap the street for the street with tracks 🚋: tap on top. The tram waits if a car is in front.", "Ton tram doit rouler le long du front de mer, à côté des voitures. Remplace la rue par la rue avec rails 🚋 : touche dessus. Le tram attend si une voiture est devant."],
["En Asunción el tren cruza dos calles llenas de coches. Pon pasos a nivel encima de las calles y, si quieres, una estación en el medio para los pasajeros.", "In Asunción the train crosses two streets full of cars. Put level crossings on the streets and, if you like, a station in the middle for the passengers.", "À Asunción le train traverse deux rues pleines de voitures. Pose des passages à niveau sur les rues et, si tu veux, une gare au milieu pour les voyageurs."],
["Río tiene mucho tráfico. Pon pasos a nivel encima de las calles para cruzarlas, y cuidado con el tranvía que da vueltas: ¡pulsa ▶️ en el momento justo!", "Rio has lots of traffic. Put level crossings on the streets to cross them, and watch out for the tram going round: press ▶️ at just the right moment!", "Rio a beaucoup de circulation. Pose des passages à niveau sur les rues pour les traverser, et attention au tram qui tourne : appuie sur ▶️ au bon moment !"],
["¡Vacas y un tren de mercancías! Las vacas te hacen frenar y el otro tren cruza tu vía dos veces. Pulsa ▶️ en el momento justo para no chocar.", "Cows and a freight train! The cows make you brake and the other train crosses your track twice. Press ▶️ at just the right moment so you don't crash.", "Des vaches et un train de marchandises ! Les vaches te font freiner et l'autre train croise ta voie deux fois. Appuie sur ▶️ au bon moment pour ne pas le percuter."],
["La selva es muy espesa. El único camino pasa por dentro de los montes, por sus túneles. ¡Usa piezas largas para gastar pocas!", "The jungle is very thick. The only way goes through the hills, by their tunnels. Use long pieces so you use fewer!", "La jungle est très épaisse. Le seul chemin passe dans les collines, par leurs tunnels. Utilise des pièces longues pour en utiliser moins !"],
["El Salto Ángel es la cascada más alta del mundo. La 🏁 está arriba de la montaña, en el piso 3: sube con rampas ⬆️ Sube.", "Angel Falls is the highest waterfall in the world. The 🏁 is at the top of the mountain, on floor 3: climb with ⬆️ Up ramps.", "Le Salto Ángel est la plus haute cascade du monde. Le 🏁 est en haut de la montagne, à l'étage 3 : monte avec des rampes ⬆️ Monte."],
["Dos desvíos en las montañas del café. Para coger las dos 🪙, deja primero los desvíos rectos y cámbialos con ✋ uno a uno. ¡Después llega a la 🏁!", "Two switches in the coffee mountains. To get both 🪙, first leave the switches straight and change them with ✋ one at a time. Then reach the 🏁!", "Deux aiguillages dans les montagnes du café. Pour prendre les deux 🪙, laisse d'abord les aiguillages tout droit et change-les avec ✋ un par un. Ensuite arrive au 🏁 !"],
["La Nariz del Diablo es un tren que sube la montaña en zigzag. El tren entra en la vía muerta y da marcha atrás: entonces cambia el desvío con ✋ para que suba hacia la 🏁.", "The Devil's Nose is a train that climbs the mountain in a zigzag. The train goes into the dead end and backs out: then change the switch with ✋ so it climbs towards the 🏁.", "Le Nez du Diable est un train qui monte la montagne en zigzag. Le train entre dans la voie sans issue et fait marche arrière : alors change l'aiguillage avec ✋ pour qu'il monte vers le 🏁."],
["Machu Picchu está en lo alto de la montaña, ¡en el piso 4! Sube dando vueltas con 4 curvas rampa seguidas, como una espiral.", "Machu Picchu is high up the mountain, on floor 4! Climb round and round with 4 ramp curves in a row, like a spiral.", "Le Machu Picchu est en haut de la montagne, à l'étage 4 ! Monte en tournant avec 4 courbes en rampe à la suite, comme une spirale."],
["El salar de Uyuni es un desierto de sal blanca enorme. El camino es muy largo: usa rectas largas y curvas grandes para gastar pocas piezas.", "The Uyuni salt flat is a huge white salt desert. The way is very long: use long straights and big curves so you use few pieces.", "Le salar d'Uyuni est un immense désert de sel blanc. Le chemin est très long : utilise de grandes droites et de grandes courbes pour utiliser peu de pièces."],
["Para cruzar los Andes hay que subir muy alto: ¡hasta el piso 2! Así pasas por encima de las montañas y del otro tren. Después baja con ⬇️ Baja.", "To cross the Andes you have to climb very high: up to floor 2! That way you pass over the mountains and the other train. Then come down with ⬇️ Down.", "Pour traverser les Andes il faut monter très haut : jusqu'à l'étage 2 ! Comme ça tu passes au-dessus des montagnes et de l'autre train. Ensuite redescends avec ⬇️ Descend."],
["¡El fin del mundo! Dos trenes tienen que cruzar la bahía: uno por encima del agua y el otro por debajo, como un subte. Lleva cada uno a su 🏁.", "The end of the world! Two trains have to cross the bay: one above the water and the other underneath, like a subway. Take each one to its 🏁.", "Le bout du monde ! Deux trains doivent traverser la baie : l'un au-dessus de l'eau et l'autre dessous, comme un métro. Amène chacun à son 🏁."],
